server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Disable caching for HTML, JSON, and JavaScript entrypoints so deployments take effect immediately
    location ~* \.(?:html|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    location ~* (?:flutter_service_worker\.js|flutter_bootstrap\.js|main\.dart\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
