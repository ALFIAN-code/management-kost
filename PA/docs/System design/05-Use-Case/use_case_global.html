<script>
function getSVGString() {
  const svg = document.getElementById('usecase-svg');
  let s = new XMLSerializer().serializeToString(svg);
  if (!s.includes('xmlns=')) {
    s = s.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  }
  return s;
}

function download(href, name) {
  const a = document.createElement('a');
  a.href = href;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => a.remove(), 100);
}

function exportSVG() {
  const blob = new Blob([getSVGString()], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  download(url, 'use_case_global.svg');
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportPNG(scale = 2) {
  const svg = document.getElementById('usecase-svg');
  const w = 780, h = 690;
  const canvas = document.createElement('canvas');
  canvas.width = w * scale;
  canvas.height = h * scale;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(scale, scale);

  const svgString = getSVGString();
  const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
  const blobUrl = URL.createObjectURL(blob);

  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(blobUrl);
    try {
      const dataUrl = canvas.toDataURL('image/png');
      download(dataUrl, 'use_case_global@' + scale + 'x.png');
    } catch (e) {
      canvas.toBlob((b) => {
        if (b) {
          const u = URL.createObjectURL(b);
          download(u, 'use_case_global@' + scale + 'x.png');
          setTimeout(() => URL.revokeObjectURL(u), 1000);
        }
      }, 'image/png');
    }
  };
  img.onerror = (err) => {
    URL.revokeObjectURL(blobUrl);
    const fallbackImg = new Image();
    fallbackImg.onload = () => {
      ctx.drawImage(fallbackImg, 0, 0);
      download(canvas.toDataURL('image/png'), 'use_case_global@' + scale + 'x.png');
    };
    fallbackImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
  };
  img.src = blobUrl;
}
</script>
