<?xml version="1.0" encoding="UTF-8"?>
<svg id="fig-svg" width="540" height="150" viewBox="0 0 540 150" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="540" height="150" fill="#ffffff"/>
    <defs>
      <marker id="arr-r" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
      </marker>
      <marker id="arr-l" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto">
        <path d="M6,0 L0,3 L6,6 Z" fill="#64748b"/>
      </marker>
    </defs>

    <!-- UI Box -->
    <rect x="30" y="38" width="90" height="74" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="75" y="81" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">UI</text>

    <!-- BLoC Box -->
    <rect x="225" y="38" width="90" height="74" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
    <text x="270" y="81" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">BLoC</text>

    <!-- Data Box -->
    <rect x="420" y="38" width="90" height="74" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
    <text x="465" y="81" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">Data</text>

    <!-- Arrows between UI and BLoC -->
    <!-- Top arrow: States (BLoC -> UI) -->
    <line x1="215" y1="58" x2="130" y2="58" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-l)"/>
    <rect x="150" y="47" width="46" height="16" rx="4" fill="#ffffff"/>
    <text x="173" y="59" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">States</text>

    <!-- Bottom arrow: Events (UI -> BLoC) -->
    <line x1="130" y1="92" x2="215" y2="92" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-r)"/>
    <rect x="148" y="84" width="50" height="16" rx="4" fill="#ffffff"/>
    <text x="173" y="96" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Events</text>

    <!-- Arrows between BLoC and Data -->
    <!-- Top arrow: Request (BLoC -> Data) -->
    <line x1="325" y1="58" x2="410" y2="58" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-r)"/>
    <rect x="342" y="47" width="52" height="16" rx="4" fill="#ffffff"/>
    <text x="368" y="59" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Request</text>

    <!-- Bottom arrow: Response (Data -> BLoC) -->
    <line x1="410" y1="92" x2="325" y2="92" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-l)"/>
    <rect x="339" y="84" width="58" height="16" rx="4" fill="#ffffff"/>
    <text x="368" y="96" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Response</text>
  </svg>