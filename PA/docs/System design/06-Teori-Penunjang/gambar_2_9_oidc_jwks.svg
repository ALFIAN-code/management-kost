<svg id="fig-svg" width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="680" height="260" fill="#ffffff"/>
    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
      </marker>
      <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
      </marker>
      <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
      </marker>
      <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706" />
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed" />
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569" />
      </marker>
    </defs>
    
    <!-- Entitas Header Boxes -->
    <rect x="25" y="15" width="130" height="34" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <text x="90" y="32" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Pengguna</text>
    <text x="90" y="43" font-size="8" fill="#64748b" text-anchor="middle">Browser / Web Client</text>

    <rect x="250" y="15" width="160" height="34" rx="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="330" y="32" font-size="10.5" font-weight="700" fill="#5b21b6" text-anchor="middle">OpenID Provider</text>
    <text x="330" y="43" font-size="8" fill="#7c3aed" text-anchor="middle">Keycloak (Identity Server)</text>

    <rect x="495" y="15" width="160" height="34" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="575" y="32" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="middle">Backend API</text>
    <text x="575" y="43" font-size="8" fill="#3b82f6" text-anchor="middle">Resource Server (NestJS)</text>

    <!-- Lifelines -->
    <line x1="90" y1="50" x2="90" y2="245" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="330" y1="50" x2="330" y2="245" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="575" y1="50" x2="575" y2="245" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Langkah 1: Login -->
    <line x1="90" y1="75" x2="322" y2="75" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>
    <text x="200" y="70" font-size="8.5" font-weight="600" fill="#334155" text-anchor="middle">1. Login kredensial (Email & Kata Sandi)</text>

    <!-- Langkah 2: Token Terbit -->
    <line x1="330" y1="105" x2="98" y2="105" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr-purple)"/>
    <text x="200" y="100" font-size="8.5" font-weight="600" fill="#6d28d9" text-anchor="middle">2. Terbitkan JWT Token (ditandatangani)</text>

    <!-- Langkah 3: Ambil Kunci Publik (Sekali diawal/cached) -->
    <line x1="575" y1="130" x2="338" y2="130" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <text x="450" y="125" font-size="8.5" font-weight="600" fill="#1e40af" text-anchor="middle">3. Ambil Kunci Publik JWKS (disimpan cache)</text>

    <line x1="330" y1="148" x2="567" y2="148" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
    <text x="450" y="144" font-size="8.5" fill="#1e40af" text-anchor="middle">4. JWK Set (Kumpulan Kunci Publik)</text>

    <!-- Langkah 4: Request API membawa Token -->
    <line x1="90" y1="178" x2="567" y2="178" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>
    <text x="310" y="173" font-size="8.5" font-weight="600" fill="#0f172a" text-anchor="middle">5. Permintaan API + Header Authorization: Bearer &lt;Token&gt;</text>

    <!-- Langkah 5: Verifikasi Mandiri -->
    <rect x="480" y="195" width="190" height="38" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
    <text x="575" y="210" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">6. Verifikasi Mandiri (Lokal)</text>
    <text x="575" y="224" font-size="7.5" fill="#15803d" text-anchor="middle">Periksa tanda tangan (JWKS) & masa aktif</text>
    
  </svg>