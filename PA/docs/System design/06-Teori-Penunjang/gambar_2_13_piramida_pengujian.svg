<svg id="fig-svg" width="680" height="215" viewBox="0 0 680 215" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="680" height="215" fill="#ffffff"/>
    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
      </marker>
      <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
      </marker>
      <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
      </marker>
      <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706" />
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed" />
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569" />
      </marker>
    </defs>
    
    <!-- Segitiga Piramida -->
    <!-- Tier 1: UI / E2E (Puncak) -->
    <polygon points="230,15 175,65 285,65" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
    <text x="230" y="45" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">UI / E2E</text>
    <text x="230" y="58" font-size="8" font-weight="600" fill="#b91c1c" text-anchor="middle">±10%</text>

    <!-- Tier 2: Integrasi (Tengah) -->
    <polygon points="175,65 285,65 340,125 120,125" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="230" y="92" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">Integration / Service</text>
    <text x="230" y="107" font-size="8" font-weight="600" fill="#b45309" text-anchor="middle">±20%</text>

    <!-- Tier 3: Unit (Dasar) -->
    <polygon points="120,125 340,125 400,185 60,185" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.4"/>
    <text x="230" y="152" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">Unit Tests</text>
    <text x="230" y="167" font-size="8" font-weight="600" fill="#15803d" text-anchor="middle">±70% (Fondasi Utama)</text>

    <!-- Indikator Kiri: Kecepatan & Biaya -->
    <line x1="32" y1="180" x2="32" y2="25" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>
    <text transform="translate(22, 105) rotate(-90)" font-size="8.5" font-weight="700" fill="#334155" text-anchor="middle">Biaya & Waktu Eksekusi Meningkat</text>

    <!-- Penjelasan Tiap Lapisan (Kanan) -->
    <!-- Card E2E -->
    <rect x="420" y="20" width="245" height="45" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <rect x="420" y="20" width="6" height="45" rx="2" fill="#ef4444"/>
    <text x="435" y="36" font-size="9.5" font-weight="700" fill="#991b1b">End-to-End / UI Tests (Paling Sedikit)</text>
    <text x="435" y="52" font-size="8" fill="#64748b">Menguji alur sistem lengkap dari antarmuka; lambat & rapuh.</text>

    <!-- Card Integrasi -->
    <rect x="420" y="75" width="245" height="45" rx="5" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <rect x="420" y="75" width="6" height="45" rx="2" fill="#f59e0b"/>
    <text x="435" y="91" font-size="9.5" font-weight="700" fill="#92400e">Integration Tests (Jumlah Sedang)</text>
    <text x="435" y="107" font-size="8" fill="#64748b">Menguji komunikasi antar-modul, database, dan API endpoint.</text>

    <!-- Card Unit -->
    <rect x="420" y="130" width="245" height="45" rx="5" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
    <rect x="420" y="130" width="6" height="45" rx="2" fill="#22c55e"/>
    <text x="435" y="146" font-size="9.5" font-weight="700" fill="#166534">Unit Tests (Porsi Terbesar)</text>
    <text x="435" y="162" font-size="8" fill="#64748b">Menguji fungsi & aturan bisnis secara terisolasi; sangat cepat.</text>

    <text x="230" y="204" font-size="8" fill="#64748b" text-anchor="middle">*Rasio 70/20/10 merupakan acuan umum industri (Mike Cohn & Google Testing Guide)</text>
    
  </svg>