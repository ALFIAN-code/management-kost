<style>

    <text x="445" y="79" font-size="8.5" font-weight="700" fill="#475569">Nomor</text>
    <text x="500" y="79" font-size="8.5" font-weight="700" fill="#1e40af">building_id</text>

    <text x="445" y="155" font-size="8.5">Kamar 2</text>

    <!-- Baris 4: Gedung B -->
    <rect x="400" y="165" width="255" height="26" fill="#fffbeb" stroke="#fde68a" stroke-width="0.6"/>

    <!-- Panah dari App ke DB -->
    <path d="M 360 99 L 390 99" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <path d="M 360 176 L 390 176" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    
  </svg>
</div>
<script>
const NAME = 'gambar_2_8_row_level_scoping_simple';
function getSVG() {
  return new XMLSerializer().serializeToString(document.getElementById('fig-svg'));
}
function download(href, filename) {
  const a = document.createElement('a'); a.href = href; a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 100);
}
function exportSVG() {
  const blob = new Blob([getSVG()], { type: 'image/svg+xml;charset=utf-8' });
  download(URL.createObjectURL(blob), NAME + '.svg');
}
function exportPNG(scale = 2) {
  const svg = document.getElementById('fig-svg');
  const w = +svg.getAttribute('width'), h = +svg.getAttribute('height');
  const canvas = document.createElement('canvas');
  canvas.width = w * scale; canvas.height = h * scale;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(scale, scale);
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0);
    download(canvas.toDataURL('image/png'), NAME + '@' + scale + 'x.png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(getSVG());
}
</script>
</body>
</html>
