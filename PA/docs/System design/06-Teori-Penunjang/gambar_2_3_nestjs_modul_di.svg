<svg id="fig-svg" width="680" height="245" viewBox="0 0 680 245" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="680" height="245" fill="#ffffff"/>
    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
      </marker>
      <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
      </marker>
      <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
      </marker>
      <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706" />
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed" />
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569" />
      </marker>
    </defs>
    
    <!-- Root Container (Aplikasi NestJS) -->
    <rect x="15" y="15" width="650" height="215" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="30" y="32" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">WADAH APLIKASI NESTJS (IoC CONTAINER)</text>

    <!-- MODULE A -->
    <rect x="35" y="45" width="260" height="170" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="35" y="45" width="260" height="26" rx="6" fill="#eff6ff"/>
    <text x="48" y="62" font-size="11" font-weight="700" fill="#1e40af">Module A (Penyedia)</text>
    <text x="280" y="62" font-size="9" font-weight="600" fill="#3b82f6" text-anchor="end">@Module()</text>

    <!-- Service A (Exported) -->
    <rect x="50" y="82" width="230" height="52" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
    <text x="62" y="100" font-size="10.5" font-weight="700" fill="#166534">Public Service A</text>
    <text x="62" y="114" font-size="8.5" fill="#15803d">Terdaftar pada "exports"</text>
    <text x="62" y="125" font-size="7.5" fill="#16a34a">(Dapat digunakan modul lain)</text>
    <rect x="195" y="93" width="75" height="18" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
    <text x="232" y="105.5" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">Bisa Diakses</text>

    <!-- Service X (Encapsulated / Private) -->
    <rect x="50" y="146" width="230" height="52" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="62" y="164" font-size="10.5" font-weight="700" fill="#991b1b">Internal Service X</text>
    <text x="62" y="178" font-size="8.5" fill="#b91c1c">Disembunyikan (privat)</text>
    <text x="62" y="189" font-size="7.5" fill="#dc2626">(Hanya di dalam Module A)</text>
    <rect x="195" y="157" width="75" height="18" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="232" y="169.5" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">Terselubung</text>

    <!-- MODULE B -->
    <rect x="385" y="45" width="260" height="170" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="385" y="45" width="260" height="26" rx="6" fill="#f5f3ff"/>
    <text x="398" y="62" font-size="11" font-weight="700" fill="#5b21b6">Module B (Pengguna)</text>
    <text x="630" y="62" font-size="8.5" font-weight="600" fill="#7c3aed" text-anchor="end">imports: [ModuleA]</text>

    <!-- Consumer Service B -->
    <rect x="400" y="82" width="230" height="116" rx="5" fill="#faf5ff" stroke="#a855f7" stroke-width="1.2"/>
    <text x="412" y="102" font-size="10.5" font-weight="700" fill="#6b21a8">Consumer Service B</text>
    <text x="412" y="117" font-size="8.5" fill="#7e22ce">Menggunakan fungsi dari Module A</text>

    <rect x="412" y="130" width="206" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="420" y="146" font-size="8.5" font-weight="600" fill="#334155">Injeksi Dependensi Otomatis (DI):</text>
    <text x="420" y="161" font-size="8.5" font-family="monospace" fill="#0f172a">constructor(</text>
    <text x="445" y="174" font-size="8.5" font-family="monospace" fill="#2563eb">private serviceA: PublicServiceA</text>
    <text x="420" y="187" font-size="8.5" font-family="monospace" fill="#0f172a">)</text>

    <!-- ARROWS CONNECTING -->
    <!-- Valid Injection Arrow -->
    <path d="M 280 108 L 340 108 L 340 145 L 400 145" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <rect x="295" y="95" width="88" height="18" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="0.8"/>
    <text x="339" y="107.5" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">✓ Diinjeksi (DI)</text>

    <!-- Blocked Access Arrow -->
    <path d="M 280 172 L 398 172" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
    <rect x="302" y="163" width="76" height="18" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="340" y="175.5" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">✗ Akses Ditolak</text>
    
  </svg>