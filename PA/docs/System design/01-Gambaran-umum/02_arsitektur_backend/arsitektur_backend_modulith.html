<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsitektur Sistem Terpadu - Sistem Manajemen Rumah Kost Multi-Gedung</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 24px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
            color: #0f172a;
        }

        .header h1 {
            margin: 0 0 4px;
            font-size: 24px;
            font-weight: 600;
        }

        .header p {
            margin: 0;
            font-size: 13px;
            color: #64748b;
        }

        .toolbar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            background-color: #0d6efd;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        button:hover {
            background-color: #0b5ed7;
        }

        #canvas-container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, .12);
            padding: 24px;
            overflow: auto;
            max-width: 100%;
        }

        svg {
            display: block;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Arsitektur Sistem Terpadu — Manajemen Rumah Kost Multi-Gedung</h1>
        <p>Satu klien Flutter Web (termasuk Tab AI Assistant), backend Modular Monolith NestJS dengan modul bisnis ala
            lego</p>
    </div>
    <div class="toolbar">
        <button id="btn-svg">Download SVG</button>
        <button id="btn-png">Download PNG (2x)</button>
    </div>
    <div id="canvas-container"></div>

    <script>
        const W = 1400, H = 1610;
        const C = {
            bg: '#ffffff', line: '#475569', muted: '#334155',
            ext: { bg: '#fef08a', stroke: '#ca8a04', t1: '#713f12', t2: '#854d0e' },
            adapter: { bg: '#f3e8ff', stroke: '#8b5cf6', t1: '#5b21b6', t2: '#334155' },
            core: { bg: 'rgb(225,245,238)', stroke: 'rgb(15,110,86)', t1: 'rgb(8,80,65)', t2: 'rgb(15,110,86)' },
            biz: { bg: 'rgb(250,236,231)', stroke: 'rgb(153,60,29)', t1: 'rgb(113,43,19)', t2: 'rgb(153,60,29)' },
            db: { bg: '#ecfeff', stroke: '#06b6d4', t1: '#0e7490', t2: '#0e7490' },
            lay: { bg: '#ede9fe', stroke: '#7c3aed', t1: '#4c1d95', t2: '#5b21b6' },
            dom: { bg: '#e1f5ee', stroke: '#0f6e56', t1: '#085041', t2: '#0f6e56' },
            panel: '#f8fafc', panelStroke: '#cbd5e1'
        };
        const NS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('width', W); svg.setAttribute('height', H);
        svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
        svg.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif');

        function el(tag, attrs, parent) {
            const e = document.createElementNS(NS, tag);
            for (const k in attrs) e.setAttribute(k, attrs[k]);
            (parent || svg).appendChild(e);
            return e;
        }
        function text(parent, x, y, str, o = {}) {
            const t = el('text', {
                x, y, 'text-anchor': o.anchor || 'middle', 'dominant-baseline': 'central',
                fill: o.fill || '#fff', 'font-size': o.size || 14, 'font-weight': o.weight || 700
            }, parent);
            t.textContent = str; return t;
        }
        function box(parent, x, y, w, h, title, sub, s, rx = 10) {
            const g = el('g', {}, parent);
            el('rect', { x, y, width: w, height: h, rx, fill: s.bg, stroke: s.stroke, 'stroke-width': 2 }, g);
            text(g, x + w / 2, y + h / 2 - 11, title, { size: 17, weight: 800, fill: s.t1 });
            if (sub) text(g, x + w / 2, y + h / 2 + 13, sub, { size: 13.5, weight: 600, fill: s.t2 });
        }
        function panel(parent, x, y, w, h, o = {}) {
            el('rect', {
                x, y, width: w, height: h, rx: o.rx || 14, fill: o.fill || C.panel, stroke: o.stroke || C.panelStroke,
                'stroke-width': o.sw || 1.5, 'stroke-dasharray': o.dashed ? '6,5' : ''
            }, parent);
        }
        function link(parent, d, o = {}) {
            const p = el('path', {
                d, fill: 'none', stroke: C.line, 'stroke-width': 2, 'stroke-linejoin': 'round',
                'marker-end': 'url(#arrow)'
            }, parent);
            if (o.dashed) p.setAttribute('stroke-dasharray', '6,5');
            if (o.both) p.setAttribute('marker-start', 'url(#arrow)');
        }
        function lbl(parent, x, y, str, anchor = 'start') { text(parent, x, y, str, { size: 14, weight: 700, fill: C.muted, anchor }); }
        function sub(parent, x, y, w, title, subt, s) {
            const g = el('g', {}, parent);
            el('rect', { x, y, width: w, height: 52, rx: 8, fill: '#fafaf7', stroke: s.stroke, 'stroke-width': 1.5 }, g);
            text(g, x + w / 2, y + 17, title, { size: 15, weight: 800, fill: '#1e1b2e' });
            text(g, x + w / 2, y + 37, subt, { size: 13, weight: 600, fill: '#334155' });
        }
        function layer(parent, y, name, hint, s, items) {
            panel(parent, 80, y, 910, 100, { fill: s.bg, stroke: s.stroke, rx: 12 });
            text(parent, 100, y + 22, name, { size: 17, weight: 800, fill: s.t1, anchor: 'start' });
            text(parent, 250, y + 22, hint, { size: 14, weight: 700, fill: s.t2, anchor: 'start' });
            items.forEach((it, i) => sub(parent, 100 + i * 295, y + 40, 280, it[0], it[1], s));
        }
        function card(parent, x, y, w, h, id, title, subt, s, toggle) {
            const g = el('g', {}, parent);
            el('rect', { x, y, width: w, height: h, rx: 10, fill: s.bg, stroke: s.stroke, 'stroke-width': 2 }, g);
            el('circle', { cx: x + 26, cy: y + h / 2, r: 16, fill: s.stroke }, g);
            text(g, x + 26, y + h / 2, id, { size: 12, weight: 800 });
            text(g, x + 54, y + h / 2 - 10, title, { size: 16, weight: 800, fill: s.t1, anchor: 'start' });
            text(g, x + 54, y + h / 2 + 12, subt, { size: 13, weight: 600, fill: s.t2, anchor: 'start' });
            if (toggle) {
                el('rect', { x: x + w - 56, y: y + h / 2 - 10, width: 38, height: 20, rx: 10, fill: s.stroke }, g);
                el('circle', { cx: x + w - 28, cy: y + h / 2, r: 7.5, fill: '#fff' }, g);
            }
        }
        function plug(parent, x1, x2, cy, s) {
            el('rect', { x: Math.min(x1, x2), y: cy - 7, width: Math.abs(x2 - x1), height: 14, fill: s.bg, stroke: s.stroke, 'stroke-width': 1.5 }, parent);
        }
        function socket(parent, x, cy, s) {
            el('circle', { cx: x, cy, r: 15, fill: s.bg, stroke: s.stroke, 'stroke-width': 2 }, parent);
            el('circle', { cx: x, cy, r: 7, fill: 'none', stroke: s.stroke, 'stroke-width': 2 }, parent);
        }

        const defs = el('defs', {});
        const marker = el('marker', {
            id: 'arrow', viewBox: '0 0 10 10', refX: '8', refY: '5',
            markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse'
        }, defs);
        el('path', { d: 'M 1 1 L 9 5 L 1 9 Z', fill: C.line }, marker);
        let back = el('g', {}), lines = el('g', {}), nodes = el('g', {});

        // ===== 1. KLIEN: FLUTTER WEB (satu-satunya klien, termasuk Tab AI Assistant) =====
        panel(back, 60, 16, 1280, 472, { stroke: '#94a3b8', dashed: true });
        text(nodes, 80, 40, 'Flutter Web', { size: 20, weight: 800, fill: '#0f172a', anchor: 'start' });
        text(nodes, 215, 40, 'Satu-satunya klien · 3 dasbor peran · Clean Architecture', { size: 14, weight: 700, fill: C.muted, anchor: 'start' });
        layer(nodes, 56, 'Presentation', 'Bergantung ke Domain', C.lay,
            [['Pages dan widget', 'Dasbor 3 peran'], ['BLoC / Cubit', 'Kelola state fitur'], ['State / event', 'Loading, sukses, error']]);
        layer(nodes, 184, 'Domain', 'Dart murni, tanpa dependensi luar', C.dom,
            [['Entity', 'Objek bisnis murni'], ['Use case', 'Satu aksi bisnis'], ['Repository', 'Interface kontrak data']]);
        layer(nodes, 312, 'Data', 'Mengimplementasi Domain', C.lay,
            [['Remote data source', 'dio, REST + Bearer'], ['Model / DTO', 'fromJson, toEntity'], ['Repository impl', 'Implementasi kontrak']]);
        link(lines, 'M 535 156 V 184'); lbl(lines, 547, 170, 'memanggil');
        link(lines, 'M 900 312 V 284'); lbl(lines, 912, 298, 'implementasi');
        box(nodes, 640, 426, 350, 52, 'Core dan DI', 'get_it, Failure, interceptor dio', { bg: '#efede6', stroke: '#9a968a', t1: '#3a3832', t2: '#44403a' }, 8);
        box(nodes, 1080, 56, 240, 100, 'Tab AI Assistant', 'Chat, kueri baca via MCP', C.lay);
        link(lines, 'M 990 106 H 1080', { dashed: true });

        // ===== bagian bawah (digeser 52px) =====
        const off = 52;
        const mk = () => el('g', { transform: `translate(0,${off})` });
        back = mk(); lines = mk(); nodes = mk();

        // ===== 2. ADAPTER ANTARMUKA =====
        panel(back, 60, 474, 1280, 114, { fill: '#f1f5f9', stroke: '#cbd5e1' });
        text(nodes, 1320, 490, 'Interface adapters / gateways', { size: 14, weight: 700, fill: C.muted, anchor: 'end' });
        box(nodes, 100, 506, 240, 64, 'Keycloak IAM', 'OpenID Connect, JWKS', C.ext);
        box(nodes, 470, 506, 260, 64, 'REST API', 'NestJS Guard, JWT, DTO', C.adapter);
        box(nodes, 1090, 506, 220, 64, 'MCP Server', 'JSON-RPC, read-only', C.adapter);

        link(lines, 'M 230 436 V 506', { dashed: true }); lbl(lines, 240, 458, 'login OIDC (SSO)');
        link(lines, 'M 570 360 V 506'); lbl(lines, 580, 458, 'REST + Bearer token');
        link(lines, 'M 1200 104 V 506', { dashed: true }); lbl(lines, 1210, 300, 'tool call baca');
        link(lines, 'M 340 538 H 470', { dashed: true }); lbl(lines, 405, 522, 'token JWT', 'middle');

        // ===== 3. MODULAR MONOLITH (LEGO) =====
        panel(back, 60, 630, 1280, 446, { fill: '#f8fafc', stroke: '#94a3b8', sw: 2 });
        text(nodes, 80, 654, 'Modular Monolith — NestJS, 9 modul', { size: 16, weight: 800, fill: '#0f172a', anchor: 'start' });
        panel(back, 80, 676, 370, 380, { fill: 'rgba(15,110,86,.08)', stroke: '#2f8f76', dashed: true });
        panel(back, 950, 676, 370, 380, { fill: 'rgba(153,60,29,.08)', stroke: '#c0653f', dashed: true });
        text(nodes, 96, 698, 'Tier inti (infrastruktur dan domain core)', { size: 14, weight: 800, fill: '#0f6e56', anchor: 'start' });
        text(nodes, 966, 698, 'Tier bisnis (fitur opsional per gedung)', { size: 14, weight: 800, fill: '#993c1d', anchor: 'start' });

        panel(back, 515, 676, 370, 380, { fill: '#f3f0e6', stroke: '#b9b4a3', sw: 1.5 });
        text(nodes, 700, 698, 'Module Gateway', { size: 17, weight: 800, fill: '#1c1c1c' });
        const GW = [['Query gateway', 'Baca lintas modul'], ['Event bus', 'Mutasi antar modul'],
        ['Module registry', 'Status modul aktif'], ['Tenant scope', 'Filter building_id']];
        GW.forEach((g, i) => {
            const y = 722 + i * 68;
            el('rect', { x: 545, y, width: 310, height: 58, rx: 8, fill: '#fff', stroke: '#c9c5b6', 'stroke-width': 1.5 }, nodes);
            text(nodes, 700, y + 21, g[0], { size: 15, weight: 800, fill: '#1c1c1c' });
            text(nodes, 700, y + 42, g[1], { size: 13, weight: 600, fill: '#3f3c34' });
        });
        text(nodes, 700, 1010, 'Internal event bus (pub/sub)', { size: 13.5, weight: 700, fill: '#3f3c34' });
        text(nodes, 700, 1032, 'Modul hanya lewat gateway', { size: 13.5, weight: 700, fill: '#3f3c34' });

        const left = [['M1', 'Auth', 'users, user_profiles'], ['M2', 'Building', 'buildings, building_settings'],
        ['M3', 'Room', 'rooms, status dan harga'], ['M4', 'Lease', 'leases, alokasi bulanan']];
        const right = [['O1', 'Finance', 'invoices, payments, fines'], ['O2', 'Maintenance', 'damage_reports, tiket'],
        ['O3', 'Guest', 'guests, buku tamu'], ['O4', 'Inventory', 'inventories, aset'],
        ['O5', 'Notification', 'notification_logs, WhatsApp']];
        left.forEach((m, i) => {
            const y = 722 + i * 68, cy = y + 29;
            plug(lines, 430, 515, cy, C.core);
            card(nodes, 100, y, 330, 58, m[0], m[1], m[2], C.core, false);
            socket(nodes, 515, cy, C.core);
        });
        right.forEach((m, i) => {
            const y = 722 + i * 68, cy = y + 29;
            plug(lines, 885, 970, cy, C.biz);
            card(nodes, 970, y, 330, 58, m[0], m[1], m[2], C.biz, true);
            socket(nodes, 885, cy, C.biz);
        });

        link(lines, 'M 230 570 V 612 H 560 V 676', { dashed: true }); lbl(lines, 240, 592, 'verifikasi JWT');
        link(lines, 'M 650 570 V 676'); lbl(lines, 660, 600, 'read dan write');
        link(lines, 'M 1200 570 V 610 H 800 V 676', { dashed: true }); lbl(lines, 1210, 592, 'read-only');

        // ===== 4. ADAPTER KELUAR =====
        panel(back, 400, 1116, 600, 110, { fill: '#f1f5f9', stroke: '#cbd5e1' });
        text(nodes, 700, 1131, 'Outbound adapters', { size: 14, weight: 700, fill: C.muted });
        box(nodes, 420, 1148, 270, 62, 'MidtransAdapter', 'implements Contract', C.adapter);
        box(nodes, 710, 1148, 270, 62, 'Channel adapter', 'Fonnte / SMTP', C.adapter);
        link(lines, 'M 555 1056 V 1148'); lbl(lines, 565, 1096, 'PaymentGatewayContract');
        link(lines, 'M 845 1056 V 1148'); lbl(lines, 855, 1096, 'Notification channel');

        box(nodes, 420, 1262, 270, 58, 'Midtrans API', 'VA / QRIS / webhook', C.ext);
        box(nodes, 710, 1262, 270, 58, 'WhatsApp / Email', 'Provider notifikasi', C.ext);
        link(lines, 'M 555 1210 V 1262', { dashed: true });
        link(lines, 'M 845 1210 V 1262', { dashed: true });
        lbl(lines, 700, 1344, 'Ganti provider: tambah adapter + ubah konfigurasi, kode modul tidak berubah', 'middle');

        // ===== 5. BASIS DATA =====
        const dbX = 330, dbY = 1376, dbW = 740, dbH = 100, ry = 16;
        const db = el('g', {}, nodes);
        el('path', {
            d: `M ${dbX} ${dbY + ry} L ${dbX} ${dbY + dbH - ry} A ${dbW / 2} ${ry} 0 0 0 ${dbX + dbW} ${dbY + dbH - ry} L ${dbX + dbW} ${dbY + ry} Z`,
            fill: C.db.bg, stroke: C.db.stroke, 'stroke-width': 2
        }, db);
        el('ellipse', { cx: dbX + dbW / 2, cy: dbY + ry, rx: dbW / 2, ry, fill: C.db.bg, stroke: C.db.stroke, 'stroke-width': 2 }, db);
        text(db, dbX + dbW / 2, dbY + 52, 'PostgreSQL', { size: 20, weight: 800, fill: C.db.t1 });
        // text(db, dbX + dbW / 2, dbY + 78, '13 tabel domain, penyaring building_id, nol FK lintas modul', { size: 14, weight: 700, fill: C.db.t2 });
        link(lines, 'M 265 1056 V 1426 H 330', { both: true }); lbl(lines, 275, 1200, 'tabel inti');
        link(lines, 'M 1135 1056 V 1426 H 1070', { both: true }); lbl(lines, 1145, 1200, 'tabel bisnis');

        // ===== LEGENDA =====
        panel(back, 70, 1504, 1260, 46, { stroke: C.panelStroke, rx: 10 });
        const lg = [['Modul inti', C.core], ['Modul bisnis (toggle)', C.biz], ['Sistem eksternal', C.ext], ['Adapter', C.adapter], ['Lapisan Flutter', C.lay]];
        let lx = 90;
        lg.forEach(it => {
            el('rect', { x: lx, y: 1520, width: 24, height: 14, rx: 3, fill: it[1].bg, stroke: it[1].stroke, 'stroke-width': 1.5 }, back);
            text(back, lx + 32, 1527, it[0], { size: 14, weight: 700, fill: C.muted, anchor: 'start' });
            lx += 32 + it[0].length * 8.4 + 24;
        });
        el('path', { d: `M ${lx} 1527 H ${lx + 28}`, stroke: C.line, 'stroke-width': 2, 'marker-end': 'url(#arrow)' }, back);
        text(back, lx + 36, 1527, 'Request', { size: 14, weight: 700, fill: C.muted, anchor: 'start' });
        lx += 130;
        el('path', { d: `M ${lx} 1527 H ${lx + 28}`, stroke: C.line, 'stroke-width': 2, 'stroke-dasharray': '6,5', 'marker-end': 'url(#arrow)' }, back);
        text(back, lx + 36, 1527, 'Auth, read-only, eksternal', { size: 14, weight: 700, fill: C.muted, anchor: 'start' });

        document.getElementById('canvas-container').appendChild(svg);

        document.getElementById('btn-svg').addEventListener('click', () => {
            const src = new XMLSerializer().serializeToString(svg);
            const blob = new Blob([src], { type: 'image/svg+xml;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = 'arsitektur_terpadu.svg';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        });
        document.getElementById('btn-png').addEventListener('click', () => {
            const src = new XMLSerializer().serializeToString(svg);
            const scale = 2;
            const canvas = document.createElement('canvas');
            canvas.width = W * scale; canvas.height = H * scale;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = C.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png'); a.download = 'arsitektur_terpadu.png';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            };
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(src)));
        });
    </script>
</body>

</html>
