        <text x="95" y="35" class="entity-title">Midtrans</text>
        <text x="95" y="55" class="entity-role">Payment Gateway (SNAP)</text>
      </g>
      <g id="ent-wa" transform="translate(970, 560)">
        <rect width="190" height="75" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"></rect>
        <text x="95" y="35" class="entity-title">WhatsApp Gateway</text>
        <text x="95" y="55" class="entity-role">Fonnte / Open-WA</text>
      </g>
      <g id="ent-ai" transform="translate(970, 770)">
        <rect width="190" height="75" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"></rect>
        <text x="95" y="35" class="entity-title">Model Bahasa AI</text>
        <text x="95" y="55" class="entity-role">(MCP Host / LLM)</text>
      </g>

      <!-- ALIRAN KIRI -->
      <path d="M 230 170 L 490 170 L 490 391" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"></path>
      <text x="360" y="160" class="flow-label">Data Gedung, Kebijakan Sewa &amp; Peran</text>

      <path d="M 520 367 L 520 205 L 230 205" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"></path>
