      <!-- ALIRAN KANAN -->
      <path d="M 970 170 L 690 170 L 690 374" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"></path>
      <text x="830" y="158" class="flow-label">Kunci JWKS &amp; Metadata Klien</text>

      <path d="M 730 416 L 730 205 L 970 205" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"></path>
      <text x="850" y="222" class="flow-label">Pencabutan Sesi (Logout)</text>

      <path d="M 743 440 L 800 440 L 800 370 L 970 370" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"></path>
      <text x="885" y="358" class="flow-label">Permintaan Token SNAP</text>

      <path d="M 970 405 L 810 405 L 810 480 L 754 480" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"></path>
      <text x="885" y="425" class="flow-label">Webhook Settlement</text>

      <path d="M 754 520 L 850 520 L 850 580 L 970 580" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"></path>
      <text x="910" y="570" class="flow-label">Payload Pesan Tagihan</text>

      <path d="M 970 615 L 820 615 L 820 565 L 741 565" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"></path>
      <text x="895" y="634" class="flow-label">Status Pengiriman Pesan</text>

      <path d="M 970 790 L 760 790 L 760 600 L 718 600" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"></path>
      <text x="865" y="780" class="flow-label">Panggilan Tool Baca (MCP)</text>

      <path d="M 640 650 L 640 825 L 970 825" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"></path>
      <text x="805" y="845" class="flow-label">Data Agregat Faktual (JSON)</text>
    </svg>