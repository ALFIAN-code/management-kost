<svg width="100%" viewBox="0 0 1060 670" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Piramida Pengujian Perangkat Lunak (Testing Pyramid) - Wisma Amal</title>
  <desc>Distribusi pengujian berlapis dari Unit Tests di dasar piramida hingga End-to-End Tests di puncak piramida.</desc>

  <style>
    text { font-family: "anthropic-sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title-main { font-size: 16px; font-weight: 700; fill: #2a2723; }
    .sub-main { font-size: 12px; font-weight: 400; fill: #6d6b67; }
    .tier-title { font-size: 13.5px; font-weight: 700; }
    .tier-sub { font-size: 11px; font-weight: 500; }
    .tier-desc { font-size: 10.5px; font-weight: 400; fill: #383835; }
    .badge-text { font-size: 10px; font-weight: 600; fill: #ffffff; }
    .side-title { font-size: 11px; font-weight: 700; fill: #454442; letter-spacing: 0.5px; }
    .side-sub { font-size: 9.5px; font-weight: 400; fill: #7b7974; }
  </style>

  <!-- Background Canvas with ample padding -->
  <rect x="0" y="0" width="1060" height="670" fill="#ffffff" rx="12"/>

  <!-- Main Header -->
  <g transform="translate(530, 28)" text-anchor="middle">
    <text y="0" class="title-main">PIRAMIDA PENGUJIAN SISTEM (TESTING PYRAMID)</text>
    <text y="18" class="sub-main">Distribusi Strategi Software Quality Assurance — Sistem Manajemen Wisma Amal</text>
  </g>

  <!-- ==================== LEFT SIDE INDICATOR (BIAYA & WAKTU - PANAH NAIK) ==================== -->
  <g transform="translate(60, 335)">
    <!-- Vertical line going up -->
    <line x1="0" y1="210" x2="0" y2="-215" stroke="#7b7974" stroke-width="1.5"/>
    <!-- Direct Arrowhead pointing UP -->
    <polygon points="0,-226 -5,-213 5,-213" fill="#7b7974"/>
    <!-- Rotated Text on the left of the line (clean padding to canvas border) -->
    <g transform="rotate(-90 0 0)">
      <text x="0" y="-12" text-anchor="middle" class="side-title">BIAYA &amp; WAKTU EKSEKUSI</text>
      <text x="0" y="-27" text-anchor="middle" class="side-sub">(Lebih Lambat &amp; Kompleks)</text>
    </g>
  </g>

  <!-- ==================== RIGHT SIDE INDICATOR (VOLUME & KECEPATAN - PANAH TURUN) ==================== -->
  <g transform="translate(1000, 335)">
    <!-- Vertical line going down -->
    <line x1="0" y1="-215" x2="0" y2="210" stroke="#7b7974" stroke-width="1.5"/>
    <!-- Direct Arrowhead pointing DOWN -->
    <polygon points="0,221 -5,208 5,208" fill="#7b7974"/>
    <!-- Rotated Text on the right of the line (clean padding to canvas border) -->
    <g transform="rotate(90 0 0)">
      <text x="0" y="-12" text-anchor="middle" class="side-title">VOLUME &amp; KECEPATAN</text>
      <text x="0" y="-27" text-anchor="middle" class="side-sub">(Cakupan Terbanyak ≥80% &amp; Eksekusi Cepat)</text>
    </g>
  </g>

  <!-- ==================== TIER 4: E2E TESTS (PUNCAK PIRAMIDA) ==================== -->
  <g transform="translate(530, 70)">
    <!-- Top width = 430px (x: -215 to 215), Bottom width = 500px (x: -250 to 250), Height = 104px -->
    <path d="M -215 0 L 215 0 L 250 104 L -250 104 Z" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
    <!-- Content -->
    <text x="0" y="24" text-anchor="middle" class="tier-title" fill="#880e4f">1. End-to-End (E2E) Tests</text>
    <text x="0" y="41" text-anchor="middle" class="tier-sub" fill="#ad1457">Simulasi Alur Lengkap Pengguna (Critical Happy Paths)</text>
    <text x="0" y="60" text-anchor="middle" class="tier-desc">• Reservasi Kamar → Bayar Midtrans SNAP → Aktivasi Sewa Otomatis</text>
    <text x="0" y="75" text-anchor="middle" class="tier-desc">• Tiket Komplain Kerusakan &amp; Konsultasi Analitik AI via MCP Tab</text>
    <!-- Badge -->
    <rect x="-85" y="82" width="170" height="16" rx="8" fill="#c2185b"/>
    <text x="0" y="93" text-anchor="middle" class="badge-text">Playwright / Flutter Driver</text>
  </g>

  <!-- ==================== TIER 3: INTEGRATION & ISOLATION TESTS ==================== -->
  <g transform="translate(530, 184)">
    <!-- Top width = 520px (x: -260 to 260), Bottom width = 630px (x: -315 to 315), Height = 110px -->
    <path d="M -260 0 L 260 0 L 315 110 L -315 110 Z" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
    <!-- Content -->
    <text x="0" y="26" text-anchor="middle" class="tier-title" fill="#e65100">2. Integration &amp; Tenant Isolation Tests</text>
    <text x="0" y="44" text-anchor="middle" class="tier-sub" fill="#ef6c00">Orkestrasi Event Bus Antar-Modul &amp; Keamanan Multi-Gedung</text>
    <text x="0" y="63" text-anchor="middle" class="tier-desc">• Event Bus: JadwalDibuat memicu pembuatan Invoice di Modul Finance</text>
    <text x="0" y="78" text-anchor="middle" class="tier-desc">• Isolasi Tenant: Pengelola Gedung A dilarang akses data Gedung B (HTTP 403)</text>
    <text x="0" y="93" text-anchor="middle" class="tier-desc">• Simulasi Webhook Settlement Midtrans berproteksi SHA-512 Signature</text>
    <!-- Badge -->
    <rect x="-95" y="96" width="190" height="16" rx="8" fill="#f57c00"/>
    <text x="0" y="107" text-anchor="middle" class="badge-text">Pest Integration / Laravel HTTP</text>
  </g>

  <!-- ==================== TIER 2: API CONTRACT & VALIDATION TESTS ==================== -->
  <g transform="translate(530, 304)">
    <!-- Top width = 650px (x: -325 to 325), Bottom width = 760px (x: -380 to 380), Height = 112px -->
    <path d="M -325 0 L 325 0 L 380 112 L -380 112 Z" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
    <!-- Content -->
    <text x="0" y="27" text-anchor="middle" class="tier-title" fill="#1a237e">3. API Contract &amp; Validation Tests</text>
    <text x="0" y="45" text-anchor="middle" class="tier-sub" fill="#283593">Standarisasi Envelope JSON, FormRequest, &amp; DTO Type-Safety</text>
    <text x="0" y="65" text-anchor="middle" class="tier-desc">• Verifikasi struktur envelope baku: {status, message, data, meta, errors}</text>
    <text x="0" y="80" text-anchor="middle" class="tier-desc">• Strict FormRequest input validation (HTTP 422 Unprocessable Entity)</text>
    <text x="0" y="95" text-anchor="middle" class="tier-desc">• Kesesuaian skema output DTO terhadap spesifikasi living docs OpenAPI</text>
    <!-- Badge -->
    <rect x="-105" y="98" width="210" height="16" rx="8" fill="#3949ab"/>
    <text x="0" y="109" text-anchor="middle" class="badge-text">Pest Feature / Schema Assertions</text>
  </g>

  <!-- ==================== TIER 1: UNIT TESTS (BASE TIER) ==================== -->
  <g transform="translate(530, 426)">
    <!-- Top width = 780px (x: -390 to 390), Bottom width = 890px (x: -445 to 445), Height = 145px -->
    <path d="M -390 0 L 390 0 L 445 145 L -445 145 Z" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <!-- Content -->
    <text x="0" y="28" text-anchor="middle" class="tier-title" fill="#1b5e20">4. Unit Tests (Base Tier — Target Cakupan ≥80%)</text>
    <text x="0" y="47" text-anchor="middle" class="tier-sub" fill="#2e7d32">Logika Bisnis Terisolasi, State Transitions, &amp; Komputasi Deterministik</text>
    <text x="0" y="68" text-anchor="middle" class="tier-desc">• Backend: Domain Services, Concurrency Locking (SELECT ... FOR UPDATE), State Machine</text>
    <text x="0" y="84" text-anchor="middle" class="tier-desc">• Frontend: Domain UseCases, Entity Mappers, Repository Impl, BLoC State Transitions (bloc_test)</text>
    <text x="0" y="100" text-anchor="middle" class="tier-desc">• MCP Server: Deterministic Tool Functions (get_building_occupancy, get_financial_summary)</text>
    <text x="0" y="116" text-anchor="middle" class="tier-desc">• Otentikasi: Validasi Stateless Token JWKS Keycloak &amp; JIT User Provisioning Logic</text>
    <!-- Badge -->
    <rect x="-125" y="125" width="250" height="16" rx="8" fill="#2e7d32"/>
    <text x="0" y="137" text-anchor="middle" class="badge-text">Pest PHP (BE) / flutter_test + mocktail (FE)</text>
  </g>

  <!-- Footer Baseline Note -->
  <g transform="translate(530, 615)" text-anchor="middle">
    <rect x="-340" y="-12" width="680" height="24" rx="6" fill="#f1efea" stroke="#d2d1c7" stroke-width="0.5"/>
    <text y="4" font-size="10" font-weight="500" fill="#5f5e5a">Otomasi Pengujian Terintegrasi pada Pipeline CI/CD — Memastikan Zero Regression di Setiap Commit</text>
  </g>
</svg>
