<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPMN — Alur Pengawasan Buku Tamu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f8fafc; color: #0f172a; padding: 24px;
    display: flex; flex-direction: column; align-items: center;
  }
  .header-bar {
    width: 100%; max-width: 1440px; display: flex; justify-content: space-between; align-items: center;
    background: #ffffff; padding: 16px 24px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px;
  }
  .header-title h1 { font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
  .header-title p { font-size: 0.875rem; color: #64748b; margin: 0; }
  .toolbar { display: flex; gap: 10px; }
  .btn {
    padding: 8px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 600;
    cursor: pointer; border: 1px solid #cbd5e1; background: #ffffff; color: #334155;
    transition: all 0.2s;
  }
  .btn:hover { background: #f1f5f9; }
  .btn.primary { background: #2563eb; color: #ffffff; border-color: #2563eb; }
  .btn.primary:hover { background: #1d4ed8; }
  .canvas-wrap {
    background: #ffffff; padding: 24px; border-radius: 16px; border: 1px solid #e2e8f0;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); width: 100%; max-width: 1440px;
    overflow-x: auto; display: flex; justify-content: center;
  }
  svg { display: block; user-select: none; }
</style>
</head>
<body>

<div class="header-bar">
  <div class="header-title">
    <h1>BPMN 2.0 — Alur Pengawasan Buku Tamu &amp; Kunjungan</h1>
    <p>Kolaborasi Proses Bisnis: Penghuni, Tamu Luar, Pengelola / Satpam, &amp; Sistem Kost</p>
  </div>
  <div class="toolbar">
    <button class="btn" onclick="exportSVG()">Download SVG</button>
    <button class="btn primary" onclick="exportPNG(2)">Download PNG (2x)</button>
  </div>
</div>

<div class="canvas-wrap">
  <svg id="bpmn-svg" width="1420" height="740" viewBox="0 0 1420 740" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
      </marker>
    </defs>

    <!-- POOL CONTAINER -->
    <rect x="20" y="20" width="1380" height="700" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" />
    
    <!-- POOL HEADER -->
    <rect x="20" y="20" width="45" height="700" rx="8" fill="#0f172a" />
    <text x="-370" y="50" transform="rotate(-90)" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">PENGAWASAN BUKU TAMU &amp; KUNJUNGAN</text>

    <!-- LANES -->
    <!-- Lane 1: Penghuni (y: 20, h: 150) -->
    <rect x="65" y="20" width="1335" height="150" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
    <rect x="65" y="20" width="35" height="150" fill="#e2e8f0" />
    <text x="-95" y="88" transform="rotate(-90)" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">Penghuni</text>

    <!-- Lane 2: Tamu Luar (y: 170, h: 160) -->
    <rect x="65" y="170" width="1335" height="160" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <rect x="65" y="170" width="35" height="160" fill="#fef3c7" />
    <text x="-250" y="88" transform="rotate(-90)" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">Tamu Luar</text>

    <!-- Lane 3: Pengelola / Satpam (y: 330, h: 170) -->
    <rect x="65" y="330" width="1335" height="170" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
    <rect x="65" y="330" width="35" height="170" fill="#e2e8f0" />
    <text x="-415" y="88" transform="rotate(-90)" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">Pengelola / Satpam</text>

    <!-- Lane 4: Sistem Kost (y: 500, h: 220) -->
    <rect x="65" y="500" width="1335" height="220" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <rect x="65" y="500" width="35" height="220" fill="#dbeafe" />
    <text x="-610" y="88" transform="rotate(-90)" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">Sistem Kost</text>

    <!-- FLOW NODES -->

    <!-- STAGE 1: REGISTRASI OLEH PENGHUNI (Col 1 & Col 2) -->
    <!-- Lane 1: Penghuni -->
    <circle cx="125" cy="95" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
    <text x="125" y="126" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Rencana Tamu</text>

    <g transform="translate(175, 68)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Daftarkan Rencana Tamu</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">(Nama, Kontak, Inap)</text>
    </g>

    <!-- Lane 4: Sistem (Col 1) -->
    <g transform="translate(175, 560)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Catat Jadwal Kunjungan</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">(Status: Terdaftar)</text>
    </g>

    <!-- Lane 1: Terima Konfirmasi (Col 2) -->
    <g transform="translate(355, 68)">
      <rect width="140" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
      <text x="70" y="23" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">Terima Konfirmasi</text>
      <text x="70" y="40" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Tamu Terdaftar</text>
    </g>
    <circle cx="530" cy="95" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" />
    <text x="530" y="122" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">Selesai</text>


    <!-- STAGE 2: KEDATANGAN FISIK & CHECK-IN (Col 3: x=520..665) -->
    <!-- Lane 2: Tamu Luar Tiba -->
    <circle cx="460" cy="250" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
    <text x="460" y="282" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">Tiba di Kost</text>

    <g transform="translate(510, 223)">
      <rect width="150" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
      <text x="75" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Tunjukkan Identitas</text>
      <text x="75" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">ke Petugas / Satpam</text>
    </g>

    <!-- Lane 3: Pengelola Verifikasi Check-In -->
    <g transform="translate(510, 390)">
      <rect width="150" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" />
      <text x="75" y="23" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Verifikasi Identitas</text>
      <text x="75" y="40" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">&amp; Konfirmasi Check-In</text>
    </g>

    <!-- Lane 4: Sistem Rekam Masuk -->
    <g transform="translate(510, 560)">
      <rect width="150" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
      <text x="75" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Set Status 'Masuk'</text>
      <text x="75" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">&amp; Catat Jam Masuk</text>
    </g>


    <!-- STAGE 3: KEPULANGAN & CHECK-OUT (Col 4: x=720..865) -->
    <!-- Lane 2: Tamu Luar Pamit -->
    <g transform="translate(710, 223)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Selesai Kunjungan</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">&amp; Lapor Pulang</text>
    </g>

    <!-- Lane 3: Pengelola Konfirmasi Check-Out -->
    <g transform="translate(710, 390)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Konfirmasi Check-Out</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Kepulangan Tamu</text>
    </g>

    <!-- Lane 4: Sistem Rekam Pulang -->
    <g transform="translate(710, 560)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Set Status 'Keluar'</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">&amp; Catat Jam Pulang</text>
    </g>


    <!-- STAGE 4: EVALUASI INAP & REKAPITULASI (Col 5 & Col 6) -->
    <!-- Gateway: Tamu Menginap? -->
    <g transform="translate(900, 568)">
      <polygon points="19,0 38,19 19,38 0,19" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
      <path d="M 13 13 L 25 25 M 25 13 L 13 25" stroke="#d97706" stroke-width="2.5" />
    </g>
    <rect x="870" y="540" width="100" height="18" rx="3" fill="#ffffff" />
    <text x="920" y="553" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">Tamu Menginap?</text>

    <!-- Task: Hitung Biaya Inap (Col 5-Bawah) -->
    <g transform="translate(975, 630)">
      <rect width="155" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" />
      <text x="77" y="21" font-size="11.5" font-weight="700" fill="#78350f" text-anchor="middle">Hitung Durasi Inap &amp;</text>
      <text x="77" y="36" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="middle">Tambah Biaya Tagihan</text>
    </g>

    <!-- Task: Rekap Riwayat Kunjungan (Col 6) -->
    <g transform="translate(1180, 560)">
      <rect width="145" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
      <text x="72" y="23" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">Arsip Riwayat Tamu</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">&amp; Log Keamanan</text>
    </g>

    <!-- SINGLE CLEAR TERMINATION -->
    <circle cx="1375" cy="587" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2.8" />
    <text x="1375" y="618" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Selesai</text>


    <!-- SEQUENCE FLOWS (ZERO OVERLAP: CORRIDOR x=247 IS COMPLETELY CLEAR) -->

    <!-- Penghuni Daftarkan Tamu -> Sistem -->
    <path d="M 142 95 L 175 95" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <!-- Turun lewat koridor bersih x=247 tanpa ada kotak di depannya -->
    <path d="M 247 122 L 247 560" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="252" y="330" width="80" height="18" rx="3" fill="#ffffff" />
    <text x="292" y="343" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">Form Rencana</text>

    <!-- Sistem Catat Jadwal -> Konfirmasi ke Penghuni (NAIK LEWAT KORIDOR x=335) -->
    <path d="M 320 587 L 335 587 L 335 95 L 355 95" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="340" y="330" width="75" height="18" rx="3" fill="#ffffff" />
    <text x="377" y="343" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Notifikasi OK</text>
    
    <!-- Terima Konfirmasi -> End Penghuni -->
    <path d="M 495 95 L 516 95" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />

    <!-- Tamu Tiba -> Tunjukkan Identitas -->
    <path d="M 477 250 L 510 250" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />

    <!-- Tunjukkan Identitas -> Pengelola Check-In (KELUAR SISI BAWAH DI x=585, TURUN KE ATAS PENGELOLA) -->
    <path d="M 585 277 L 585 390" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />

    <!-- Pengelola Check-In -> Sistem Masuk (KELUAR SISI BAWAH DI x=585, TURUN KE ATAS SISTEM) -->
    <path d="M 585 444 L 585 560" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="540" y="495" width="90" height="18" rx="3" fill="#ffffff" />
    <text x="585" y="508" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">Update Jam Tiba</text>

    <!-- Sistem Masuk -> Durasi Kunjungan -> Tamu Pamit (KELUAR KANAN SISTEM, NAIK KE KIRI PAMIT) -->
    <path d="M 660 587 L 685 587 L 685 250 L 710 250" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="645" y="330" width="85" height="18" rx="3" fill="#ffffff" />
    <text x="687" y="343" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">Waktu Kunjung</text>

    <!-- Tamu Pamit -> Pengelola Check-Out (KELUAR SISI BAWAH DI x=782, TURUN KE ATAS PENGELOLA) -->
    <path d="M 782 277 L 782 390" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />

    <!-- Pengelola Check-Out -> Sistem Pulang (KELUAR SISI BAWAH DI x=782, TURUN KE ATAS SISTEM) -->
    <path d="M 782 444 L 782 560" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="735" y="495" width="95" height="18" rx="3" fill="#ffffff" />
    <text x="782" y="508" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">Update Jam Pulang</text>

    <!-- Sistem Pulang -> Gateway Menginap? -->
    <path d="M 855 587 L 900 587" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />

    <!-- Gateway -> [Ya / Menginap]: KELUAR SUDUT BAWAH TURUN KE HITUNG BIAYA INAP -->
    <path d="M 919 606 L 919 655 L 975 655" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="922" y="618" width="24" height="16" rx="3" fill="#ffffff" />
    <text x="934" y="630" font-size="9.5" font-weight="700" fill="#d97706" text-anchor="middle">Ya</text>

    <!-- Hitung Biaya Inap -> Arsip Riwayat (KELUAR KANAN, NAIK MASUK KE ARSIP) -->
    <path d="M 1130 655 L 1155 655 L 1155 587 L 1180 587" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />

    <!-- Gateway -> [Tidak / Biasa]: LURUS KE ARSIP RIWAYAT -->
    <path d="M 938 587 L 1180 587" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="1030" y="573" width="40" height="18" rx="3" fill="#ffffff" />
    <text x="1050" y="586" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">Tidak</text>

    <!-- Arsip Riwayat -> End Event Tunggal -->
    <path d="M 1325 587 L 1359 587" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />

  </svg>
</div>

<script>
function getSVGString() {
  const svg = document.getElementById('bpmn-svg');
  let s = new XMLSerializer().serializeToString(svg);
  if (!s.includes('xmlns=')) {
    s = s.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  }
  return s;
}

function download(href, name) {
  const a = document.createElement('a');
  a.href = href;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function exportSVG() {
  const blob = new Blob([getSVGString()], { type: 'image/svg+xml;charset=utf-8' });
  download(URL.createObjectURL(blob), 'alur_pengawasan_buku_tamu.svg');
}

function exportPNG(scale = 2) {
  const svg = document.getElementById('bpmn-svg');
  const w = 1420, h = 740;
  const canvas = document.createElement('canvas');
  canvas.width = w * scale;
  canvas.height = h * scale;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(scale, scale);

  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0);
    download(canvas.toDataURL('image/png'), 'alur_pengawasan_buku_tamu@' + scale + 'x.png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(getSVGString());
}
</script>
</body>
</html>
