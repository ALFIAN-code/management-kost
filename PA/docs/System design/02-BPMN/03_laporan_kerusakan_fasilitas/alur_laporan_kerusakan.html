<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPMN — Alur Laporan Kerusakan & Komplain</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f8fafc; color: #0f172a; padding: 24px;
    display: flex; flex-direction: column; align-items: center;
  }
  .header-bar {
    width: 100%; max-width: 1360px; display: flex; justify-content: space-between; align-items: center;
    background: #ffffff; padding: 16px 24px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px;
  }
  .header-title h1 { font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
  .header-title p { font-size: 0.875rem; color: #64748b; margin: 0; }
  .toolbar { display: flex; gap: 10px; }
  .btn {
    padding: 8px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 600;
    cursor: pointer; border: 1px solid #cbd5e1; background: #ffffff; color: #334155;
    transition: all 0.2s;
  }
  .btn:hover { background: #f1f5f9; }
  .btn.primary { background: #2563eb; color: #ffffff; border-color: #2563eb; }
  .btn.primary:hover { background: #1d4ed8; }
  .canvas-wrap {
    background: #ffffff; padding: 24px; border-radius: 16px; border: 1px solid #e2e8f0;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); width: 100%; max-width: 1360px;
    overflow-x: auto; display: flex; justify-content: center;
  }
  svg { display: block; user-select: none; }
</style>
</head>
<body>

<div class="header-bar">
  <div class="header-title">
    <h1>BPMN 2.0 — Alur Penanganan Kerusakan Fasilitas &amp; Komplain</h1>
    <p>Kolaborasi Proses Bisnis: Penghuni, Sistem Kost, Pengelola Gedung, &amp; Teknisi Servis</p>
  </div>
  <div class="toolbar">
    <button class="btn" onclick="exportSVG()">Download SVG</button>
    <button class="btn primary" onclick="exportPNG(2)">Download PNG (2x)</button>
  </div>
</div>

<div class="canvas-wrap">
  <svg id="bpmn-svg" width="1340" height="740" viewBox="0 0 1340 740" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
      </marker>
    </defs>

    <!-- POOL CONTAINER -->
    <rect x="20" y="20" width="1300" height="700" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" />
    
    <!-- POOL HEADER -->
    <rect x="20" y="20" width="45" height="700" rx="8" fill="#0f172a" />
    <text x="-370" y="50" transform="rotate(-90)" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">PENANGANAN KERUSAKAN FASILITAS</text>

    <!-- LANES -->
    <!-- Lane 1: Penghuni (y: 20, h: 160) -->
    <rect x="65" y="20" width="1255" height="160" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
    <rect x="65" y="20" width="35" height="160" fill="#e2e8f0" />
    <text x="-100" y="88" transform="rotate(-90)" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">Penghuni</text>

    <!-- Lane 2: Sistem Kost (y: 180, h: 220) -->
    <rect x="65" y="180" width="1255" height="220" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <rect x="65" y="180" width="35" height="220" fill="#dbeafe" />
    <text x="-290" y="88" transform="rotate(-90)" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">Sistem Kost</text>

    <!-- Lane 3: Pengelola (y: 400, h: 160) -->
    <rect x="65" y="400" width="1255" height="160" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
    <rect x="65" y="400" width="35" height="160" fill="#e2e8f0" />
    <text x="-480" y="88" transform="rotate(-90)" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">Pengelola</text>

    <!-- Lane 4: Teknisi (y: 560, h: 160) -->
    <rect x="65" y="560" width="1255" height="160" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <rect x="65" y="560" width="35" height="160" fill="#e2e8f0" />
    <text x="-640" y="88" transform="rotate(-90)" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">Teknisi Servis</text>

    <!-- FLOW NODES -->

    <!-- LANE 1: PENGHUNI (Col 1) -->
    <circle cx="125" cy="95" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
    <text x="125" y="128" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">Temukan Masalah</text>

    <!-- Task: Buat Tiket Komplain -->
    <g transform="translate(175, 68)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Buat Laporan Komplain</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">(Deskripsi &amp; Bukti Foto)</text>
    </g>


    <!-- LANE 2: SISTEM KOST (Col 1) -->
    <!-- Task: Catat Tiket & Notif -->
    <g transform="translate(175, 215)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Catat Tiket Komplain</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">&amp; Notifikasi Pengelola</text>
    </g>


    <!-- LANE 3: PENGELOLA (Col 2) -->
    <!-- Task: Tinjau Laporan & Evaluasi -->
    <g transform="translate(340, 450)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Tinjau Laporan &amp;</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Tingkat Urgensi</text>
    </g>


    <!-- LANE 2: SISTEM KOST (Col 3: Evaluasi Fatal) -->
    <!-- Gateway 1: Rusak Fatal? -->
    <g transform="translate(530, 230)">
      <polygon points="19,0 38,19 19,38 0,19" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
      <path d="M 13 13 L 25 25 M 25 13 L 13 25" stroke="#d97706" stroke-width="2.5" />
    </g>
    <rect x="500" y="202" width="98" height="18" rx="3" fill="#ffffff" />
    <text x="549" y="215" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">Kerusakan Fatal?</text>

    <!-- Task: Kunci Kamar Sementara (Col 3-B) -->
    <g transform="translate(590, 295)">
      <rect width="140" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
      <text x="70" y="21" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">Kunci Status Kamar</text>
      <text x="70" y="36" font-size="10.5" font-weight="500" fill="#dc2626" text-anchor="middle">(Dalam Pemeliharaan)</text>
    </g>


    <!-- LANE 3: PENGELOLA (Col 4) -->
    <!-- Task: Tugaskan Teknisi -->
    <g transform="translate(750, 450)">
      <rect width="145" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" />
      <text x="72" y="23" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Tugaskan Teknisi</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">&amp; Estimasi Waktu</text>
    </g>


    <!-- LANE 4: TEKNISI (Col 4 & Col 5) -->
    <!-- Task: Laksanakan Servis (Col 4) -->
    <g transform="translate(750, 615)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Lakukan Perbaikan</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">di Unit Kamar</text>
    </g>

    <!-- Task: Laporkan Selesai (Col 5) -->
    <g transform="translate(930, 615)">
      <rect width="140" height="54" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" />
      <text x="70" y="23" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">Laporkan Pekerjaan</text>
      <text x="70" y="40" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">Telah Selesai</text>
    </g>


    <!-- LANE 3: PENGELOLA (Col 5) -->
    <!-- Task: Inspeksi & Konfirmasi Hasil -->
    <g transform="translate(930, 450)">
      <rect width="140" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
      <text x="70" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Inspeksi Fisik &amp;</text>
      <text x="70" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Verifikasi Selesai</text>
    </g>


    <!-- LANE 2: SISTEM KOST (Col 6) -->
    <!-- Task: Pemulihan Status Kamar & Tiket Ditutup -->
    <g transform="translate(1110, 215)">
      <rect width="140" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
      <text x="70" y="23" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">Tutup Tiket &amp;</text>
      <text x="70" y="40" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Pulihkan Kamar</text>
    </g>


    <!-- LANE 1: PENGHUNI (Col 6) -->
    <!-- Task: Terima Notifikasi Selesai -->
    <g transform="translate(1110, 68)">
      <rect width="140" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
      <text x="70" y="23" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">Terima Laporan</text>
      <text x="70" y="40" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Perbaikan Selesai</text>
    </g>
    <!-- End Event Penghuni -->
    <circle cx="1295" cy="95" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" />
    <text x="1295" y="125" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Selesai</text>


    <!-- SEQUENCE FLOWS (STRICT LEFT-TO-RIGHT, ARROWS EXIT ONLY FROM BOTTOM OR TOP SIDES) -->

    <!-- Mulai -> Buat Tiket -->
    <path d="M 142 95 L 175 95" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />

    <!-- Buat Tiket -> Catat Tiket (KELUAR DARI SISI BAWAH KOTAK PENGHUNI, MASUK KE ATAS KOTAK SISTEM) -->
    <path d="M 247 122 L 247 215" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />

    <!-- Catat Tiket -> Tinjau Laporan (KELUAR DARI SISI BAWAH KOTAK SISTEM, TURUN KE PENGELOLA) -->
    <path d="M 247 269 L 247 477 L 340 477" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="252" y="360" width="80" height="18" rx="3" fill="#ffffff" />
    <text x="292" y="373" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">Kirim Laporan</text>

    <!-- Tinjau Laporan -> Gateway 1 (KELUAR DARI ATAS KOTAK PENGELOLA, NAIK KE GATEWAY SISTEM) -->
    <path d="M 412 450 L 412 249 L 530 249" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="420" y="350" width="85" height="18" rx="3" fill="#ffffff" />
    <text x="462" y="363" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">Cek Tingkat</text>

    <!-- Gateway 1 -> [Ya / Fatal]: KELUAR SUDUT BAWAH GATEWAY TURUN KE KUNCI STATUS KAMAR -->
    <path d="M 549 268 L 549 320 L 590 320" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="553" y="280" width="26" height="16" rx="3" fill="#ffffff" />
    <text x="566" y="292" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">Ya</text>

    <!-- Gateway 1 -> [Tidak / Ringan]: KELUAR SUDUT KANAN GATEWAY LURUS KE x=790 LALU TURUN KE PENGELOLA -->
    <path d="M 568 249 L 790 249 L 790 450" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="640" y="240" width="75" height="18" rx="3" fill="#ffffff" />
    <text x="677" y="253" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Tidak / Ringan</text>

    <!-- Kunci Status Kamar -> Tugaskan Teknisi (KELUAR KANAN, TURUN MASUK KE ATAS KOTAK PENGELOLA DI x=850) -->
    <path d="M 730 320 L 850 320 L 850 450" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="745" y="311" width="80" height="18" rx="3" fill="#ffffff" />
    <text x="785" y="324" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">Status Terkunci</text>

    <!-- Tugaskan Teknisi -> Lakukan Perbaikan (KELUAR DARI SISI BAWAH PENGELOLA DI x=822, TURUN KE ATAS TEKNISI) -->
    <path d="M 822 504 L 822 615" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="770" y="550" width="105" height="18" rx="3" fill="#ffffff" />
    <text x="822" y="563" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">Surat Tugas / SPK</text>

    <!-- Lakukan Perbaikan -> Laporkan Selesai (DI LANE TEKNISI: LURUS KE KANAN) -->
    <path d="M 895 642 L 930 642" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />

    <!-- Laporkan Selesai -> Inspeksi Fisik (KELUAR DARI SISI ATAS TEKNISI DI x=1000, NAIK KE SISI BAWAH PENGELOLA) -->
    <path d="M 1000 615 L 1000 504" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="955" y="550" width="90" height="18" rx="3" fill="#ffffff" />
    <text x="1000" y="563" font-size="10" font-weight="700" fill="#d97706" text-anchor="middle">Serah Pekerjaan</text>

    <!-- Inspeksi Fisik -> Tutup Tiket (KELUAR DARI SISI ATAS PENGELOLA DI x=1000, NAIK KE KIRI SISTEM) -->
    <path d="M 1000 450 L 1000 242 L 1110 242" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="1015" y="330" width="75" height="18" rx="3" fill="#ffffff" />
    <text x="1052" y="343" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Hasil Ok (ACC)</text>

    <!-- Tutup Tiket -> Terima Laporan (KELUAR DARI SISI ATAS SISTEM DI x=1180, NAIK KE SISI BAWAH PENGHUNI) -->
    <path d="M 1180 215 L 1180 122" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="1140" y="160" width="80" height="18" rx="3" fill="#ffffff" />
    <text x="1180" y="173" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Notifikasi Beres</text>

    <!-- Terima Laporan -> End Penghuni -->
    <path d="M 1250 95 L 1280 95" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />

  </svg>
</div>

<script>
function getSVGString() {
  const svg = document.getElementById('bpmn-svg');
  let s = new XMLSerializer().serializeToString(svg);
  if (!s.includes('xmlns=')) {
    s = s.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  }
  return s;
}

function download(href, name) {
  const a = document.createElement('a');
  a.href = href;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function exportSVG() {
  const blob = new Blob([getSVGString()], { type: 'image/svg+xml;charset=utf-8' });
  download(URL.createObjectURL(blob), 'alur_laporan_kerusakan.svg');
}

function exportPNG(scale = 2) {
  const svg = document.getElementById('bpmn-svg');
  const w = 1340, h = 740;
  const canvas = document.createElement('canvas');
  canvas.width = w * scale;
  canvas.height = h * scale;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(scale, scale);

  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0);
    download(canvas.toDataURL('image/png'), 'alur_laporan_kerusakan@' + scale + 'x.png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(getSVGString());
}
</script>
</body>
</html>
