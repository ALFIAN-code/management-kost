<?xml version="1.0" encoding="UTF-8"?>
<svg id="bpmn-svg" width="1300" height="740" viewBox="0 0 1300 740" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"></path>
      </marker>
    </defs>

    <!-- POOL CONTAINER -->
    <rect x="20" y="20" width="1260" height="700" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"></rect>
    
    <!-- POOL HEADER -->
    <rect x="20" y="20" width="45" height="700" rx="8" fill="#0f172a"></rect>
    <text x="-370" y="50" transform="rotate(-90)" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">SISTEM PENGELOLAAN HUNIAN RUMAH KOST</text>

    <!-- LANES -->
    <!-- Lane 1: Penghuni (y: 20, h: 160) -->
    <rect x="65" y="20" width="1215" height="160" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="20" width="35" height="160" fill="#e2e8f0"></rect>
    <text x="-100" y="88" transform="rotate(-90)" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">Penghuni</text>

    <!-- Lane 2: Sistem Kost (y: 180, h: 260) -->
    <rect x="65" y="180" width="1215" height="260" fill="#ffffff" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="180" width="35" height="260" fill="#dbeafe"></rect>
    <text x="-310" y="88" transform="rotate(-90)" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">Sistem Kost</text>

    <!-- Lane 3: Gateway Pembayaran (y: 440, h: 130) -->
    <rect x="65" y="440" width="1215" height="130" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="440" width="35" height="130" fill="#fef3c7"></rect>
    <text x="-505" y="88" transform="rotate(-90)" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">Payment GW</text>

    <!-- Lane 4: Pengelola Gedung (y: 570, h: 150) -->
    <rect x="65" y="570" width="1215" height="150" fill="#ffffff" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="570" width="35" height="150" fill="#e2e8f0"></rect>
    <text x="-645" y="88" transform="rotate(-90)" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">Pengelola</text>

    <!-- FLOW NODES -->

    <!-- LANE 1: PENGHUNI -->
    <circle cx="125" cy="95" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"></circle>
    <text x="125" y="126" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Mulai</text>

    <!-- Task: Pilih Kamar -->
    <g transform="translate(170, 68)">
      <rect width="135" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="67" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Pilih Gedung &amp;</text>
      <text x="67" y="40" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">Kamar Tersedia</text>
    </g>

    <!-- Task: Tentukan Durasi -->
    <g transform="translate(335, 68)">
      <rect width="135" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="67" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Tentukan Durasi</text>
      <text x="67" y="40" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">Sewa Bulanan</text>
    </g>

    <!-- Task: Bayar Tagihan (di Penghuni) -->
    <g transform="translate(850, 68)">
      <rect width="135" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"></rect>
      <text x="67" y="23" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Lakukan Pembayaran</text>
      <text x="67" y="40" font-size="11" font-weight="500" fill="#2563eb" text-anchor="middle">Sesuai Tagihan</text>
    </g>

    <!-- Task: Terima Bukti & Kamar -->
    <g transform="translate(1120, 68)">
      <rect width="130" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="65" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Terima Konfirmasi</text>
      <text x="65" y="40" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">&amp; Tiket Hunian</text>
    </g>

    <!-- End Event Penghuni -->
    <circle cx="1275" cy="95" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"></circle>
    <text x="1275" y="124" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Selesai</text>


    <!-- LANE 2: SISTEM KOST -->
    <!-- Task: Validasi Durasi -->
    <g transform="translate(335, 210)">
      <rect width="135" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="67" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Validasi Aturan</text>
      <text x="67" y="40" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">Minimal Durasi</text>
    </g>

    <!-- Gateway 1: Memenuhi Syarat? -->
    <g transform="translate(500, 218)">
      <polygon points="19,0 38,19 19,38 0,19" fill="#fef3c7" stroke="#d97706" stroke-width="2"></polygon>
      <path d="M 13 13 L 25 25 M 25 13 L 13 25" stroke="#d97706" stroke-width="2.5"></path>
    </g>
    <rect x="470" y="190" width="98" height="18" rx="3" fill="#ffffff"></rect>
    <text x="519" y="203" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">Durasi Sesuai?</text>

    <!-- Task Tolak Durasi -->
    <g transform="translate(450, 310)">
      <rect width="138" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"></rect>
      <text x="69" y="20" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">Peringatan Durasi</text>
      <text x="69" y="34" font-size="11" font-weight="500" fill="#dc2626" text-anchor="middle">Kurang dari Batas</text>
    </g>
    <circle cx="519" cy="385" r="13" fill="#fee2e2" stroke="#dc2626" stroke-width="2"></circle>
    <text x="519" y="410" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">Ditolak</text>

    <!-- Task: Cek Ketersediaan Kamar -->
    <g transform="translate(570, 210)">
      <rect width="135" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="67" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Cek Ketersediaan</text>
      <text x="67" y="40" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">Bebas Bentrok</text>
    </g>

    <!-- Gateway 2: Kamar Kosong? -->
    <g transform="translate(735, 218)">
      <polygon points="19,0 38,19 19,38 0,19" fill="#fef3c7" stroke="#d97706" stroke-width="2"></polygon>
      <path d="M 13 13 L 25 25 M 25 13 L 13 25" stroke="#d97706" stroke-width="2.5"></path>
    </g>
    <rect x="705" y="190" width="98" height="18" rx="3" fill="#ffffff"></rect>
    <text x="754" y="203" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">Kamar Kosong?</text>

    <!-- Task Tolak Kamar Terisi -->
    <g transform="translate(685, 310)">
      <rect width="138" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"></rect>
      <text x="69" y="20" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">Notifikasi Kamar</text>
      <text x="69" y="34" font-size="11" font-weight="500" fill="#dc2626" text-anchor="middle">Sudah Terisi</text>
    </g>
    <circle cx="754" cy="385" r="13" fill="#fee2e2" stroke="#dc2626" stroke-width="2"></circle>
    <text x="754" y="410" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">Batal</text>

    <!-- Gateway 3: Model Properti Komersial? -->
    <g transform="translate(805, 218)">
      <polygon points="19,0 38,19 19,38 0,19" fill="#fef3c7" stroke="#d97706" stroke-width="2"></polygon>
      <path d="M 13 13 L 25 25 M 25 13 L 13 25" stroke="#d97706" stroke-width="2.5"></path>
    </g>
    <rect x="780" y="190" width="88" height="18" rx="3" fill="#ffffff"></rect>
    <text x="824" y="203" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">Komersial?</text>

    <!-- Task: Terbitkan Tagihan Sewa -->
    <g transform="translate(850, 310)">
      <rect width="135" height="50" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="67" y="22" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Terbitkan Tagihan</text>
      <text x="67" y="38" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">Periode Pertama</text>
    </g>

    <!-- Task: Konfirmasi Sewa & Update Status Kamar -->
    <g transform="translate(1115, 210)">
      <rect width="140" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"></rect>
      <text x="70" y="23" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">Aktifkan Kontrak</text>
      <text x="70" y="40" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">&amp; Set Kamar Terisi</text>
    </g>


    <!-- LANE 3: GATEWAY PEMBAYARAN -->
    <g transform="translate(995, 478)">
      <rect width="140" height="54" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"></rect>
      <text x="70" y="23" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">Proses Pembayaran</text>
      <text x="70" y="40" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">Online / Digital</text>
    </g>


    <!-- LANE 4: PENGELOLA GEDUNG -->
    <g transform="translate(1115, 620)">
      <rect width="140" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="70" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Terima Notifikasi</text>
      <text x="70" y="40" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">&amp; Jadwal Check-In</text>
    </g>
    <circle cx="1275" cy="647" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"></circle>
    <text x="1275" y="675" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Selesai</text>


    <!-- SEQUENCE FLOWS -->
    <!-- Mulai -> Pilih Kamar -->
    <path d="M 142 95 L 170 95" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Pilih Kamar -> Tentukan Durasi -->
    <path d="M 305 95 L 335 95" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Tentukan Durasi -> Validasi Durasi (turun dari bawah kotak ke atas kotak sistem) -->
    <path d="M 402 122 L 402 210" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Validasi Durasi -> Gateway 1 -->
    <path d="M 470 237 L 500 237" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Gateway 1 -> [Tidak] -> Tolak Durasi (turun dari sudut bawah gateway) -->
    <path d="M 519 256 L 519 310" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="523" y="270" width="34" height="18" rx="3" fill="#ffffff"></rect>
    <text x="540" y="283" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="middle">Tidak</text>
    
    <!-- Tolak Durasi -> End Ditolak -->
    <path d="M 519 356 L 519 372" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Gateway 1 -> [Ya] -> Cek Kamar -->
    <path d="M 538 237 L 570 237" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="542" y="222" width="24" height="18" rx="3" fill="#ffffff"></rect>
    <text x="554" y="235" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">Ya</text>

    <!-- Cek Kamar -> Gateway 2 -->
    <path d="M 705 237 L 735 237" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Gateway 2 -> [Tidak] -> Tolak Kamar -->
    <path d="M 754 256 L 754 310" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="758" y="270" width="34" height="18" rx="3" fill="#ffffff"></rect>
    <text x="775" y="283" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="middle">Tidak</text>

    <!-- Tolak Kamar -> End Batal -->
    <path d="M 754 356 L 754 372" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Gateway 2 -> [Ya] -> Gateway 3 (Komersial?) -->
    <path d="M 773 237 L 805 237" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="776" y="222" width="24" height="18" rx="3" fill="#ffffff"></rect>
    <text x="788" y="235" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">Ya</text>

    <!-- Gateway 3 -> [Ya / Komersial]: turun ke Terbitkan Tagihan -->
    <path d="M 824 256 L 824 335 L 850 335" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="806" y="275" width="28" height="18" rx="3" fill="#ffffff"></rect>
    <text x="820" y="288" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Ya</text>

    <!-- Gateway 3 -> [Tidak / Non-Komersial Mes]: lurus ke kanan menuju Aktifkan Kontrak -->
    <path d="M 843 237 L 1115 237" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"></path>
    <rect x="940" y="222" width="130" height="18" rx="3" fill="#ffffff"></rect>
    <text x="1005" y="235" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">Bebas Biaya (Asrama/Mes)</text>

    <!-- Terbitkan Tagihan -> Penghuni Bayar (keluar dari atas kotak tagihan di x=917 naik ke bawah kotak bayar) -->
    <path d="M 917 310 L 917 122" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="880" y="160" width="74" height="18" rx="3" fill="#ffffff"></rect>
    <text x="917" y="173" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">Kirim Tagihan</text>

    <!-- Penghuni Bayar -> Gateway Pembayaran (keluar dari kanan kotak bayar di x=985 belok turun ke Payment GW di x=1065) -->
    <path d="M 985 95 L 1065 95 L 1065 478" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="1030" y="380" width="70" height="18" rx="3" fill="#ffffff"></rect>
    <text x="1065" y="393" font-size="10" font-weight="700" fill="#d97706" text-anchor="middle">Bayar Online</text>

    <!-- Gateway Pembayaran -> Aktifkan Kontrak (keluar kanan di x=1135 belok naik masuk bawah kotak Aktifkan Kontrak di x=1185) -->
    <path d="M 1135 505 L 1185 505 L 1185 264" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="1145" y="445" width="80" height="18" rx="3" fill="#ffffff"></rect>
    <text x="1185" y="458" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Lunas (Sukses)</text>

    <!-- Aktifkan Kontrak -> Terima Bukti (keluar atas di x=1185 naik ke Penghuni) -->
    <path d="M 1185 210 L 1185 122" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Terima Bukti -> End Penghuni -->
    <path d="M 1250 95 L 1261 95" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Aktifkan Kontrak -> Notifikasi Pengelola (keluar bawah di x=1185 turun ke Pengelola) -->
    <path d="M 1185 264 L 1185 620" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Notifikasi Pengelola -> End Pengelola -->
    <path d="M 1255 647 L 1261 647" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

  </svg>