<!DOCTYPE html>
<html lang="id">
<head>

<style>

</style>
</head>
<body>

<script>
function getSVGString() {
  const svg = document.getElementById('bpmn-svg');
  let s = new XMLSerializer().serializeToString(svg);
  if (!s.includes('xmlns=')) {
    s = s.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  }
  return s;
}

function download(href, name) {
  const a = document.createElement('a');
  a.href = href;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function exportSVG() {
  const blob = new Blob([getSVGString()], { type: 'image/svg+xml;charset=utf-8' });
  download(URL.createObjectURL(blob), 'alur_alokasi_penempatan.svg');
}

function exportPNG(scale = 2) {
  const svg = document.getElementById('bpmn-svg');
  const w = 1300, h = 740;
  const canvas = document.createElement('canvas');
  canvas.width = w * scale;
  canvas.height = h * scale;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(scale, scale);

  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0);
    download(canvas.toDataURL('image/png'), 'alur_alokasi_penempatan@' + scale + 'x.png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(getSVGString());
}
</script>
