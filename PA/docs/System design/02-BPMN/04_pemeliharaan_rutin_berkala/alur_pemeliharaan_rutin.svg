<?xml version="1.0" encoding="UTF-8"?>
<svg id="bpmn-svg" width="1460" height="640" viewBox="0 0 1460 640" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"></path>
      </marker>
    </defs>

    <!-- POOL CONTAINER -->
    <rect x="20" y="20" width="1420" height="600" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"></rect>
    
    <!-- POOL HEADER -->
    <rect x="20" y="20" width="45" height="600" rx="8" fill="#0f172a"></rect>
    <text x="-320" y="50" transform="rotate(-90)" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">PEMELIHARAAN PREVENTIF BERKALA</text>

    <!-- LANES -->
    <!-- Lane 1: Pengelola Gedung (y: 20, h: 180) -->
    <rect x="65" y="20" width="1375" height="180" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="20" width="35" height="180" fill="#e2e8f0"></rect>
    <text x="-110" y="88" transform="rotate(-90)" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">Pengelola</text>

    <!-- Lane 2: Sistem Kost (y: 200, h: 220) -->
    <rect x="65" y="200" width="1375" height="220" fill="#ffffff" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="200" width="35" height="220" fill="#dbeafe"></rect>
    <text x="-310" y="88" transform="rotate(-90)" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">Sistem Kost</text>

    <!-- Lane 3: Teknisi / Vendor Servis (y: 420, h: 200) -->
    <rect x="65" y="420" width="1375" height="200" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="420" width="35" height="200" fill="#e2e8f0"></rect>
    <text x="-520" y="88" transform="rotate(-90)" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">Teknisi / Vendor</text>

    <!-- FLOW NODES -->

    <!-- LANE 1: PENGELOLA (Col 1) -->
    <circle cx="125" cy="110" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"></circle>
    <text x="125" y="142" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Mulai</text>

    <!-- Task: Buat Agenda -->
    <g transform="translate(175, 83)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Buat Agenda Servis</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">(AC, Pompa Air, Genset)</text>
    </g>


    <!-- LANE 2: SISTEM KOST (Col 1 & Col 2) -->
    <!-- Task: Simpan Agenda (Col 1) -->
    <g transform="translate(175, 273)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Simpan Jadwal Rutin</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">&amp; Frekuensi Servis</text>
    </g>

    <!-- Task: Pemantauan Kalender (Col 2) -->
    <g transform="translate(360, 273)">
      <rect width="145" height="54" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Pemantauan Waktu</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">&amp; Hitung Mundur H-7</text>
    </g>


    <!-- LANE 1: PENGELOLA (Col 3) -->
    <!-- Task: Terima Pengingat H-7 & Kontak Vendor -->
    <g transform="translate(535, 83)">
      <rect width="145" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Terima Pengingat H-7</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">&amp; Hubungi Vendor</text>
    </g>


    <!-- LANE 3: TEKNISI / VENDOR (Col 4 & Col 5) -->
    <!-- Task: Servis Fisik (Col 4) -->
    <g transform="translate(705, 485)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Lakukan Servis &amp;</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Pengecekan Fisik</text>
    </g>

    <!-- Task: Serahkan Nota & Berita Acara (Col 5) -->
    <g transform="translate(885, 485)">
      <rect width="145" height="54" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">Serahkan Berita Acara</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">&amp; Rincian Nota</text>
    </g>


    <!-- LANE 1: PENGELOLA (Col 5) -->
    <!-- Task: Verifikasi & Input Laporan -->
    <g transform="translate(885, 83)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Verifikasi Selesai &amp;</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Input Nota Biaya</text>
    </g>


    <!-- LANE 2: SISTEM KOST (Col 6 & Col 7) -->
    <!-- Task: Rekalkulasi Jadwal Berikutnya (Col 6) -->
    <g transform="translate(1065, 273)">
      <rect width="145" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">Catat Realisasi &amp;</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Jadwal Periode Depan</text>
    </g>

    <!-- Gateway: Ada Biaya Servis? (Col 7) -->
    <g transform="translate(1240, 281)">
      <polygon points="19,0 38,19 19,38 0,19" fill="#fef3c7" stroke="#d97706" stroke-width="2"></polygon>
      <path d="M 13 13 L 25 25 M 25 13 L 13 25" stroke="#d97706" stroke-width="2.5"></path>
    </g>
    <rect x="1215" y="253" width="90" height="18" rx="3" fill="#ffffff"></rect>
    <text x="1260" y="266" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">Ada Biaya Servis?</text>

    <!-- Task: Catat Biaya Operasional (Col 7-Bawah) -->
    <g transform="translate(1275, 345)">
      <rect width="135" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"></rect>
      <text x="67" y="20" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Catat Pengeluaran</text>
      <text x="67" y="35" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Beban Pemeliharaan</text>
    </g>

    <!-- SINGLE CLEAR TERMINATION / END EVENT -->
    <circle cx="1430" cy="300" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2.8"></circle>
    <text x="1430" y="330" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Selesai</text>


    <!-- SEQUENCE FLOWS (STRICT LEFT-TO-RIGHT, CLEAR VERTICAL CORRIDORS, ZERO OVERLAP) -->

    <!-- Mulai -> Buat Agenda -->
    <path d="M 142 110 L 175 110" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Buat Agenda -> Simpan Jadwal (KELUAR DARI SISI BAWAH PENGELOLA DI x=247, TURUN KE ATAS SISTEM) -->
    <path d="M 247 137 L 247 273" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Simpan Jadwal -> Pemantauan Waktu -->
    <path d="M 320 300 L 360 300" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Pemantauan Waktu -> Terima Pengingat (KELUAR DARI ATAS SISTEM DI x=432, NAIK KE KIRI PENGELOLA) -->
    <path d="M 432 273 L 432 110 L 535 110" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="438" y="175" width="75" height="18" rx="3" fill="#ffffff"></rect>
    <text x="475" y="188" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">Notifikasi H-7</text>

    <!-- Terima Pengingat -> Lakukan Servis Fisik (KELUAR SISI BAWAH PENGELOLA DI x=607, TURUN KE KIRI TEKNISI) -->
    <path d="M 607 137 L 607 512 L 705 512" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="615" y="330" width="75" height="18" rx="3" fill="#ffffff"></rect>
    <text x="652" y="343" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">Order Servis</text>

    <!-- Lakukan Servis -> Serahkan Nota (DI LANE TEKNISI: LURUS KE KANAN) -->
    <path d="M 850 512 L 885 512" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Serahkan Nota -> Verifikasi Hasil (KELUAR SISI ATAS TEKNISI DI x=957, NAIK KE SISI BAWAH PENGELOLA) -->
    <path d="M 957 485 L 957 137" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="910" y="310" width="95" height="18" rx="3" fill="#ffffff"></rect>
    <text x="957" y="323" font-size="10" font-weight="700" fill="#d97706" text-anchor="middle">Nota &amp; BAST Fisik</text>

    <!-- Verifikasi Hasil -> Catat Realisasi (KELUAR KANAN PENGELOLA, TURUN MASUK SISI ATAS SISTEM DI x=1137) -->
    <path d="M 1030 110 L 1137 110 L 1137 273" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="1055" y="175" width="80" height="18" rx="3" fill="#ffffff"></rect>
    <text x="1095" y="188" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Input Selesai</text>

    <!-- Catat Realisasi -> Gateway Ada Biaya? -->
    <path d="M 1210 300 L 1240 300" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Gateway -> [Ya / Ada Biaya]: KELUAR SUDUT BAWAH GATEWAY TURUN KE CATAT PENGELUARAN -->
    <path d="M 1259 319 L 1259 369 L 1275 369" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="1262" y="325" width="24" height="16" rx="3" fill="#ffffff"></rect>
    <text x="1274" y="337" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">Ya</text>

    <!-- Catat Pengeluaran -> Selesai (KELUAR KANAN, NAIK MERGE MENUJU SATU END EVENT TUNGGAL) -->
    <path d="M 1410 369 L 1430 369 L 1430 316" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Gateway -> [Tidak / Tanpa Biaya]: LURUS KE SATU END EVENT TUNGGAL -->
    <path d="M 1278 300 L 1414 300" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="1330" y="285" width="40" height="18" rx="3" fill="#ffffff"></rect>
    <text x="1350" y="298" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">Tidak</text>

  </svg>