<?xml version="1.0" encoding="UTF-8"?>
<svg id="bpmn-svg" width="1240" height="580" viewBox="0 0 1240 580" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"></path>
      </marker>
    </defs>

    <!-- POOL CONTAINER -->
    <rect x="20" y="20" width="1200" height="540" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"></rect>
    
    <!-- POOL HEADER -->
    <rect x="20" y="20" width="45" height="540" rx="8" fill="#0f172a"></rect>
    <text x="-290" y="50" transform="rotate(-90)" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">MANAJEMEN PENGELUARAN &amp; LABA-RUGI</text>

    <!-- LANES -->
    <!-- Lane 1: Pengelola Gedung (y: 20, h: 170) -->
    <rect x="65" y="20" width="1155" height="170" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="20" width="35" height="170" fill="#e2e8f0"></rect>
    <text x="-105" y="88" transform="rotate(-90)" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">Pengelola</text>

    <!-- Lane 2: Sistem Kost (y: 190, h: 190) -->
    <rect x="65" y="190" width="1155" height="190" fill="#ffffff" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="190" width="35" height="190" fill="#dbeafe"></rect>
    <text x="-285" y="88" transform="rotate(-90)" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">Sistem Kost</text>

    <!-- Lane 3: Pemilik Properti (y: 380, h: 180) -->
    <rect x="65" y="380" width="1155" height="180" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="380" width="35" height="180" fill="#fef3c7"></rect>
    <text x="-470" y="88" transform="rotate(-90)" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">Pemilik (Owner)</text>

    <!-- FLOW NODES -->

    <!-- LANE 1: PENGELOLA -->
    <circle cx="125" cy="105" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"></circle>
    <text x="125" y="137" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Biaya Terjadi</text>

    <!-- Task: Input Pengeluaran -->
    <g transform="translate(180, 78)">
      <rect width="165" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="82" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Input Data Pengeluaran</text>
      <text x="82" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">(Kategori, Biaya, &amp; Nota)</text>
    </g>

    <!-- Task: Terima Konfirmasi -->
    <g transform="translate(435, 78)">
      <rect width="145" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">Terima Konfirmasi</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Beban Tercatat</text>
    </g>

    <circle cx="635" cy="105" r="17" fill="#fee2e2" stroke="#dc2626" stroke-width="3"></circle>
    <text x="635" y="137" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Selesai</text>


    <!-- LANE 2: SISTEM KOST -->
    <!-- Task: Validasi & Simpan Biaya -->
    <g transform="translate(180, 258)">
      <rect width="165" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="82" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Validasi &amp; Simpan</text>
      <text x="82" y="40" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">Transaksi Pengeluaran</text>
    </g>

    <!-- Task: Rekalkulasi Beban -->
    <g transform="translate(435, 258)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Rekalkulasi Total</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Arus Kas Keluar</text>
    </g>

    <!-- Task: Agregasi Laba Bersih -->
    <g transform="translate(670, 258)">
      <rect width="165" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"></rect>
      <text x="82" y="23" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Agregasi Laba Bersih</text>
      <text x="82" y="40" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">(Pendapatan - Beban)</text>
    </g>


    <!-- LANE 3: PEMILIK (OWNER) -->
    <circle cx="670" cy="470" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"></circle>
    <text x="670" y="502" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Tinjau Finansial</text>

    <!-- Task: Buka Dashboard Laba Rugi -->
    <g transform="translate(735, 443)">
      <rect width="155" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="77" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Akses Laporan</text>
      <text x="77" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Keuangan &amp; Laba-Rugi</text>
    </g>

    <!-- Task: Analisis Pengeluaran -->
    <g transform="translate(945, 443)">
      <rect width="160" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"></rect>
      <text x="80" y="23" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">Analisis Arus Kas Bersih</text>
      <text x="80" y="40" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">&amp; Grafik Kategori Biaya</text>
    </g>

    <circle cx="1165" cy="470" r="17" fill="#fee2e2" stroke="#dc2626" stroke-width="3"></circle>
    <text x="1165" y="502" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Selesai</text>


    <!-- SEQUENCE FLOWS -->
    <!-- Mulai Pengelola -> Input -->
    <path d="M 142 105 L 180 105" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Input -> Validasi (turun ke Sistem) -->
    <path d="M 262 132 L 262 258" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Validasi -> Rekalkulasi Beban -->
    <path d="M 345 285 L 435 285" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Rekalkulasi -> Terima Konfirmasi (naik ke Pengelola) -->
    <path d="M 507 258 L 507 132" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Terima Konfirmasi -> End Pengelola -->
    <path d="M 580 105 L 618 105" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Rekalkulasi -> Agregasi Laba Bersih -->
    <path d="M 580 285 L 670 285" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Mulai Pemilik -> Buka Dashboard -->
    <path d="M 687 470 L 735 470" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Agregasi Sistem -> Dashboard Pemilik (turun data) -->
    <path d="M 752 312 L 752 443" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="710" y="365" width="85" height="18" rx="3" fill="#ffffff"></rect>
    <text x="752" y="378" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle">Data Teragregasi</text>

    <!-- Buka Dashboard -> Analisis Pengeluaran -->
    <path d="M 890 470 L 945 470" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Analisis -> End Pemilik -->
    <path d="M 1105 470 L 1148 470" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

  </svg>