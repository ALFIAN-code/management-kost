<?xml version="1.0" encoding="UTF-8"?>
<svg id="bpmn-svg" width="1240" height="740" viewBox="0 0 1240 740" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"></path>
      </marker>
    </defs>

    <!-- POOL CONTAINER -->
    <rect x="20" y="20" width="1200" height="700" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"></rect>
    
    <!-- POOL HEADER -->
    <rect x="20" y="20" width="45" height="700" rx="8" fill="#0f172a"></rect>
    <text x="-370" y="50" transform="rotate(-90)" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">ASISTEN KECERDASAN BUATAN (AI ASSISTANT)</text>

    <!-- LANES -->
    <!-- Lane 1: Pemilik / Pengelola (y: 20, h: 160) -->
    <rect x="65" y="20" width="1155" height="160" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="20" width="35" height="160" fill="#fef3c7"></rect>
    <text x="-100" y="88" transform="rotate(-90)" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">Pemilik / Pengelola</text>

    <!-- Lane 2: Antarmuka Sistem (y: 180, h: 160) -->
    <rect x="65" y="180" width="1155" height="160" fill="#ffffff" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="180" width="35" height="160" fill="#e2e8f0"></rect>
    <text x="-260" y="88" transform="rotate(-90)" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">Antarmuka Chat</text>

    <!-- Lane 3: Mesin Kecerdasan Buatan (y: 340, h: 180) -->
    <rect x="65" y="340" width="1155" height="180" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="340" width="35" height="180" fill="#fae8ff"></rect>
    <text x="-430" y="88" transform="rotate(-90)" fill="#86198f" font-size="13" font-weight="700" text-anchor="middle">Mesin AI (LLM)</text>

    <!-- Lane 4: Sistem Data & Modul Kost (y: 520, h: 200) -->
    <rect x="65" y="520" width="1155" height="200" fill="#ffffff" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="520" width="35" height="200" fill="#dbeafe"></rect>
    <text x="-620" y="88" transform="rotate(-90)" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">Sistem &amp; Data Kost</text>

    <!-- FLOW NODES -->

    <!-- LANE 1: PEMILIK / PENGELOLA -->
    <circle cx="125" cy="95" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"></circle>
    <text x="125" y="126" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Mulai</text>

    <!-- Task: Input Pertanyaan -->
    <g transform="translate(180, 68)">
      <rect width="155" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="77" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Ketik Pertanyaan</text>
      <text x="77" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Bahasa Alami (Prompt)</text>
    </g>

    <!-- Task: Terima Wawasan & Ambil Keputusan -->
    <g transform="translate(1005, 68)">
      <rect width="150" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"></rect>
      <text x="75" y="23" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">Tinjau Wawasan Data</text>
      <text x="75" y="40" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">&amp; Ambil Keputusan</text>
    </g>

    <circle cx="1185" cy="95" r="17" fill="#fee2e2" stroke="#dc2626" stroke-width="3"></circle>
    <text x="1185" y="126" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Selesai</text>


    <!-- LANE 2: ANTARMUKA SISTEM -->
    <!-- Task: Teruskan Pertanyaan & Katalog Data -->
    <g transform="translate(180, 233)">
      <rect width="155" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="77" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Kirim Pertanyaan &amp;</text>
      <text x="77" y="40" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">Daftar Konteks Data</text>
    </g>

    <!-- Task: Tampilkan Jawaban & Tabel -->
    <g transform="translate(1005, 233)">
      <rect width="150" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"></rect>
      <text x="75" y="23" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Sajikan Narasi Jawaban</text>
      <text x="75" y="40" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">&amp; Tabel Ringkasan</text>
    </g>


    <!-- LANE 3: MESIN AI -->
    <!-- Task: Analisis Niat & Kebutuhan Data -->
    <g transform="translate(390, 400)">
      <rect width="165" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="82" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Analisis Niat Pertanyaan</text>
      <text x="82" y="40" font-size="11" font-weight="600" fill="#86198f" text-anchor="middle">&amp; Tentukan Data Dibutuhkan</text>
    </g>

    <!-- Task: Sintesis Respon Bebas Halusinasi -->
    <g transform="translate(800, 400)">
      <rect width="165" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="82" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Sintesis Jawaban Analitis</text>
      <text x="82" y="40" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">(Berdasarkan Fakta Data)</text>
    </g>


    <!-- LANE 4: SISTEM DATA & MODUL KOST -->
    <!-- Task: Validasi Akses Gedung -->
    <g transform="translate(390, 590)">
      <rect width="165" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="82" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Validasi Izin &amp;</text>
      <text x="82" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Kepemilikan Properti</text>
    </g>

    <!-- Task: Tarik & Agregasi Data Faktual -->
    <g transform="translate(595, 590)">
      <rect width="165" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"></rect>
      <text x="82" y="23" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Ambil Data Faktual</text>
      <text x="82" y="40" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">(Keuangan, Hunian, Aset)</text>
    </g>

    <!-- Task: Catat Log Audit Konsultasi -->
    <g transform="translate(800, 590)">
      <rect width="165" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="82" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Catat Riwayat Kueri</text>
      <text x="82" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">&amp; Log Akses Sistem</text>
    </g>


    <!-- SEQUENCE FLOWS -->
    <!-- Mulai -> Input Pertanyaan -->
    <path d="M 142 95 L 180 95" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Input Pertanyaan -> Kirim ke Antarmuka (turun) -->
    <path d="M 257 122 L 257 233" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Antarmuka -> Mesin AI (turun ke analisis) -->
    <path d="M 335 260 L 472 260 L 472 400" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Mesin AI -> Validasi Akses Gedung (turun ke Sistem Data) -->
    <path d="M 472 454 L 472 590" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="425" y="505" width="95" height="18" rx="3" fill="#ffffff"></rect>
    <text x="472" y="518" font-size="10.5" font-weight="700" fill="#86198f" text-anchor="middle">Permintaan Data</text>

    <!-- Validasi Akses -> Ambil Data Faktual -->
    <path d="M 555 617 L 595 617" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Ambil Data -> Catat Log Audit -->
    <path d="M 760 617 L 800 617" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Ambil Data -> Kirim Fakta ke Mesin AI (naik ke Sintesis) -->
    <path d="M 677 590 L 677 427 L 800 427" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="695" y="414" width="90" height="18" rx="3" fill="#ffffff"></rect>
    <text x="740" y="427" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle">Data Terstruktur</text>

    <!-- Mesin AI -> Antarmuka Sajikan Jawaban (naik ke Antarmuka) -->
    <path d="M 965 427 L 1080 427 L 1080 287" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Antarmuka -> Tinjau Wawasan Pemilik (naik ke Pemilik) -->
    <path d="M 1080 233 L 1080 122" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Pemilik Tinjau -> End -->
    <path d="M 1155 95 L 1168 95" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

  </svg>