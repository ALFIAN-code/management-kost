<?xml version="1.0" encoding="UTF-8"?>
<svg id="bpmn-svg" width="1340" height="740" viewBox="0 0 1340 740" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"></path>
      </marker>
    </defs>

    <!-- POOL CONTAINER -->
    <rect x="20" y="20" width="1300" height="700" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"></rect>
    
    <!-- POOL HEADER -->
    <rect x="20" y="20" width="45" height="700" rx="8" fill="#0f172a"></rect>
    <text x="-370" y="50" transform="rotate(-90)" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">MANAJEMEN KEUANGAN &amp; PENAGIHAN SEWA</text>

    <!-- LANES -->
    <!-- Lane 1: Penghuni (y: 20, h: 160) -->
    <rect x="65" y="20" width="1255" height="160" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="20" width="35" height="160" fill="#e2e8f0"></rect>
    <text x="-100" y="88" transform="rotate(-90)" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">Penghuni</text>

    <!-- Lane 2: Sistem Kost (y: 180, h: 260) -->
    <rect x="65" y="180" width="1255" height="260" fill="#ffffff" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="180" width="35" height="260" fill="#dbeafe"></rect>
    <text x="-310" y="88" transform="rotate(-90)" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">Sistem Kost</text>

    <!-- Lane 3: Gateway Pembayaran (y: 440, h: 140) -->
    <rect x="65" y="440" width="1255" height="140" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="440" width="35" height="140" fill="#fef3c7"></rect>
    <text x="-510" y="88" transform="rotate(-90)" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">Payment GW</text>

    <!-- Lane 4: Pengelola (y: 580, h: 140) -->
    <rect x="65" y="580" width="1255" height="140" fill="#ffffff" stroke="#94a3b8" stroke-width="1"></rect>
    <rect x="65" y="580" width="35" height="140" fill="#e2e8f0"></rect>
    <text x="-650" y="88" transform="rotate(-90)" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">Pengelola</text>

    <!-- FLOW NODES -->

    <!-- LANE 2: SISTEM KOST (Pemicu & Penerbitan) -->
    <!-- Start Event: Pemicu Jadwal / Kontrak -->
    <circle cx="125" cy="245" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"></circle>
    <text x="125" y="278" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Jadwal Tagihan</text>

    <!-- Task: Hitung Tagihan -->
    <g transform="translate(175, 218)">
      <rect width="140" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="70" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Hitung Kewajiban</text>
      <text x="70" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Sewa &amp; Layanan</text>
    </g>

    <!-- Sub-Alur: Monitoring Jatuh Tempo -->
    <circle cx="125" cy="360" r="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"></circle>
    <text x="125" y="390" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">Timer Harian</text>

    <g transform="translate(175, 335)">
      <rect width="140" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"></rect>
      <text x="70" y="22" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">Pantau Jatuh Tempo</text>
      <text x="70" y="36" font-size="10.5" font-weight="500" fill="#dc2626" text-anchor="middle">&amp; Batas Toleransi</text>
    </g>

    <!-- Task: Terapkan Denda -->
    <g transform="translate(360, 335)">
      <rect width="145" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"></rect>
      <text x="72" y="22" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">Terapkan Denda &amp;</text>
      <text x="72" y="36" font-size="10.5" font-weight="500" fill="#dc2626" text-anchor="middle">Akumulasi Tagihan</text>
    </g>

    <!-- Task: Terbitkan Tagihan -->
    <g transform="translate(360, 218)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Terbitkan Tagihan</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">&amp; Kirim Notifikasi</text>
    </g>


    <!-- LANE 1: PENGHUNI -->
    <!-- Task: Buka Tagihan & Pilih Pembayaran -->
    <g transform="translate(360, 68)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Terima Tagihan &amp;</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Pilih Metode Bayar</text>
    </g>

    <!-- Gateway 1: Metode Pembayaran -->
    <g transform="translate(540, 76)">
      <polygon points="19,0 38,19 19,38 0,19" fill="#fef3c7" stroke="#d97706" stroke-width="2"></polygon>
      <path d="M 13 13 L 25 25 M 25 13 L 13 25" stroke="#d97706" stroke-width="2.5"></path>
    </g>
    <rect x="518" y="48" width="82" height="18" rx="3" fill="#ffffff"></rect>
    <text x="559" y="61" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">Metode Bayar?</text>

    <!-- Task: Pembayaran Online (Col 5) -->
    <g transform="translate(620, 68)">
      <rect width="145" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Bayar via Digital</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">(QRIS / VA / E-Wallet)</text>
    </g>

    <!-- Task: Pembayaran Tunai (Col 6) -->
    <g transform="translate(800, 68)">
      <rect width="145" height="54" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Bayar Tunai / Manual</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">ke Rekening Pengelola</text>
    </g>

    <!-- Task: Terima Kuitansi & Status Lunas (Col 8) -->
    <g transform="translate(1140, 68)">
      <rect width="135" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"></rect>
      <text x="67" y="23" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">Terima Kuitansi &amp;</text>
      <text x="67" y="40" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Status Sewa Aktif</text>
    </g>
    <!-- End Event Penghuni -->
    <circle cx="1295" cy="95" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"></circle>
    <text x="1295" y="125" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Selesai</text>


    <!-- LANE 3: GATEWAY PEMBAYARAN (Col 5) -->
    <g transform="translate(620, 480)">
      <rect width="145" height="54" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">Verifikasi Transaksi</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">&amp; Kirim Webhook</text>
    </g>


    <!-- LANE 4: PENGELOLA (Col 6 & Col 8) -->
    <!-- Task: Verifikasi Tunai (Col 6) -->
    <g transform="translate(800, 620)">
      <rect width="145" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Verifikasi Fisik &amp;</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Konfirmasi Manual</text>
    </g>

    <!-- Task: Terima Laporan Arus Kas (Col 8) -->
    <g transform="translate(1140, 620)">
      <rect width="135" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"></rect>
      <text x="67" y="23" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Rekap Laporan</text>
      <text x="67" y="40" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Arus Kas Masuk</text>
    </g>
    <!-- End Event Pengelola -->
    <circle cx="1295" cy="647" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"></circle>
    <text x="1295" y="677" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Selesai</text>


    <!-- LANE 2: SISTEM KOST (Pelunasan & Validasi - Col 7) -->
    <g transform="translate(980, 218)">
      <rect width="145" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"></rect>
      <text x="72" y="23" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">Set Invoice Lunas &amp;</text>
      <text x="72" y="40" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Terbitkan Kuitansi</text>
    </g>


    <!-- SEQUENCE FLOWS (NON-OVERLAPPING STRICT COLUMN ROUTING) -->

    <!-- Start -> Hitung Tagihan -->
    <path d="M 142 245 L 175 245" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Hitung Tagihan -> Terbitkan Invoice -->
    <path d="M 315 245 L 360 245" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Flow Monitoring Denda (Sistem) -->
    <path d="M 139 360 L 175 360" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"></path>
    <path d="M 315 360 L 360 360" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"></path>

    <!-- Terapkan Denda -> Terbitkan Tagihan (KELUAR DARI ATAS, MASUK DARI BAWAH KOTAK TARGET TEPAT DI TENGAH) -->
    <path d="M 432 335 L 432 272" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"></path>
    <rect x="375" y="295" width="115" height="18" rx="3" fill="#ffffff"></rect>
    <text x="432" y="308" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">Update Total Tagihan</text>

    <!-- Terbitkan Invoice -> Terima Tagihan (naik ke Penghuni) -->
    <path d="M 432 218 L 432 122" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="395" y="160" width="75" height="18" rx="3" fill="#ffffff"></rect>
    <text x="432" y="173" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">Kirim Tagihan</text>

    <!-- Terima Tagihan -> Gateway 1 -->
    <path d="M 505 95 L 540 95" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Gateway 1 -> [Digital / Online]: lurus ke kanan -->
    <path d="M 578 95 L 620 95" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="582" y="80" width="34" height="16" rx="3" fill="#ffffff"></rect>
    <text x="599" y="92" font-size="9.5" font-weight="700" fill="#2563eb" text-anchor="middle">Online</text>

    <!-- Gateway 1 -> [Manual / Tunai]: belok lewat atas ke Bayar Tunai -->
    <path d="M 559 76 L 559 45 L 872 45 L 872 68" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="680" y="36" width="60" height="16" rx="3" fill="#ffffff"></rect>
    <text x="710" y="48" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">Tunai / Bank</text>

    <!-- Online Bayar -> Payment Gateway (TURUN LEWAT KORIDOR BERSIH x=692) -->
    <path d="M 692 122 L 692 480" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="650" y="380" width="84" height="18" rx="3" fill="#ffffff"></rect>
    <text x="692" y="393" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">Bayar Digital</text>

    <!-- Manual Bayar -> Pengelola Verifikasi (TURUN LEWAT KORIDOR BERSIH x=872) -->
    <path d="M 872 122 L 872 620" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="835" y="380" width="74" height="18" rx="3" fill="#ffffff"></rect>
    <text x="872" y="393" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">Serah Tunai</text>

    <!-- Payment Gateway -> Set Lunas (KELUAR KANAN, NAIK MASUK BAWAH KOTAK SISTEM DI x=1020) -->
    <path d="M 765 507 L 1020 507 L 1020 272" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="840" y="497" width="95" height="18" rx="3" fill="#ffffff"></rect>
    <text x="887" y="510" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Notifikasi Lunas</text>

    <!-- Pengelola Verifikasi -> Set Lunas (KELUAR KANAN, NAIK MASUK BAWAH KOTAK SISTEM DI x=1090) -->
    <path d="M 945 647 L 1090 647 L 1090 272" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="980" y="637" width="95" height="18" rx="3" fill="#ffffff"></rect>
    <text x="1027" y="650" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Konfirmasi Tunai</text>

    <!-- Set Lunas -> Terima Kuitansi (Penghuni - KELUAR ATAS DI x=1052 NAIK KE PENGHUNI) -->
    <path d="M 1052 218 L 1052 95 L 1140 95" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>
    <rect x="1058" y="145" width="70" height="18" rx="3" fill="#ffffff"></rect>
    <text x="1093" y="158" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Kirim Kuitansi</text>

    <!-- Terima Kuitansi -> End Penghuni -->
    <path d="M 1275 95 L 1280 95" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Set Lunas -> Rekap Arus Kas (Pengelola - KELUAR KANAN DI x=1125 TURUN KE PENGELOLA) -->
    <path d="M 1125 245 L 1150 245 L 1150 647" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

    <!-- Rekap Arus Kas -> End Pengelola -->
    <path d="M 1275 647 L 1280 647" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"></path>

  </svg>