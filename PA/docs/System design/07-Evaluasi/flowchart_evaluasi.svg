<svg id="fc-eval" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1080" width="1120" height="1080">
  <defs>
    <style>
      .title { font: 800 22px/1.2 "Times New Roman", Georgia, serif; fill: #0f172a; text-decoration: underline; }
      .sub { font: 600 13px/1.3 -apple-system, "Segoe UI", Roboto, sans-serif; fill: #475569; }
      .node-t { font: 800 14px/1.25 -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .node-d { font: 600 12px/1.3 -apple-system, "Segoe UI", Roboto, sans-serif; fill: #334155; }
      .term-t { font: 800 14px/1.25 -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffffff; }
      .dec-t { font: 800 13.5px/1.2 -apple-system, "Segoe UI", Roboto, sans-serif; fill: #78350f; }
      .lbl { font: 700 12.5px/1 -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; }
      .line-red { stroke: #dc2626; stroke-width: 2.2; stroke-dasharray: 6 4; fill: none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="1080" fill="#ffffff" />

  <!-- Header -->
  <text x="560" y="38" text-anchor="middle" class="title">FLOWCHART EVALUASI SISTEM</text>
  <text x="560" y="60" text-anchor="middle" class="sub">Alur Pengujian Lima Aspek: Fungsional, Modularitas 10 Modul, Multi-Tenant, Idempotensi Midtrans, dan Modul AI</text>

  <!-- 1. MULAI -->
  <rect x="430" y="84" width="260" height="46" rx="23" fill="#1e293b" />
  <text x="560" y="112" text-anchor="middle" class="term-t">MULAI EVALUASI</text>
  <line x1="560" y1="130" x2="560" y2="156" class="line" marker-end="url(#arr)" />

  <!-- 2. PERSIAPAN LINGKUNGAN -->
  <rect x="270" y="160" width="580" height="72" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2" />
  <text x="560" y="186" text-anchor="middle" class="node-t">1. Persiapan Lingkungan &amp; Data Uji (Docker, PostgreSQL, Keycloak, Sandbox)</text>
  <text x="560" y="206" text-anchor="middle" class="node-d">Menyiapkan 2 tenant (Gedung A &amp; B), 3 akun peran (Owner, Admin, Resident),</text>
  <text x="560" y="222" text-anchor="middle" class="node-d">data kamar/kontrak awal, serta daftar 10 pertanyaan uji kueri AI faktual.</text>
  <line x1="560" y1="232" x2="560" y2="258" class="line" marker-end="url(#arr)" />

  <!-- 3. UJI 1: BLACK-BOX -->
  <rect x="270" y="262" width="580" height="68" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" />
  <text x="560" y="288" text-anchor="middle" class="node-t">2. Pengujian Black-Box Fungsional (17 Fitur: F01–F17)</text>
  <text x="560" y="308" text-anchor="middle" class="node-d">Parameter: Kesesuaian respons HTTP, struktur amplop JSON, validasi DTO (HTTP 422), &amp; state UI.</text>
  <line x1="560" y1="330" x2="560" y2="356" class="line" marker-end="url(#arr)" />

  <!-- 4. UJI 2: MODULARITAS -->
  <rect x="270" y="360" width="580" height="68" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2" />
  <text x="560" y="386" text-anchor="middle" class="node-t">3. Pengujian Kombinasi Modul / Modularitas Lego (Skenario A–E)</text>
  <text x="560" y="406" text-anchor="middle" class="node-d">Parameter: 0 cascade error saat modul opsional (termasuk Modul AI) diaktifkan / dinonaktifkan.</text>
  <line x1="560" y1="428" x2="560" y2="454" class="line" marker-end="url(#arr)" />

  <!-- 5. UJI 3: MULTI-TENANT -->
  <rect x="270" y="458" width="580" height="68" rx="10" fill="#fdf4ff" stroke="#a21caf" stroke-width="2" />
  <text x="560" y="484" text-anchor="middle" class="node-t">4. Pengujian Isolasi Multi-Tenant (building_id) &amp; SSO Keycloak</text>
  <text x="560" y="504" text-anchor="middle" class="node-d">Parameter: 100% penolakan lintas gedung (HTTP 403) &amp; 0 kebocoran baris data antar-tenant.</text>
  <line x1="560" y1="526" x2="560" y2="552" class="line" marker-end="url(#arr)" />

  <!-- 6. UJI 4: IDEMPOTENSI MIDTRANS -->
  <rect x="270" y="556" width="580" height="68" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2" />
  <text x="560" y="582" text-anchor="middle" class="node-t">5. Pengujian Idempotensi &amp; Keamanan Webhook Midtrans SNAP</text>
  <text x="560" y="602" text-anchor="middle" class="node-d">Parameter: 0 duplikasi pembayaran pada webhook berulang &amp; 100% tolak signature tidak valid.</text>
  <line x1="560" y1="624" x2="560" y2="650" class="line" marker-end="url(#arr)" />

  <!-- 7. UJI 5: MODUL AI -->
  <rect x="270" y="654" width="580" height="72" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2" />
  <text x="560" y="680" text-anchor="middle" class="node-t">6. Pengujian Akurasi &amp; Keamanan Read-Only Modul AI (AI / MCP Assistant)</text>
  <text x="560" y="700" text-anchor="middle" class="node-d">Parameter: Akurasi jawaban AI vs kueri SQL langsung (%), kepatuhan tenant scope,</text>
  <text x="560" y="716" text-anchor="middle" class="node-d">serta 100% penolakan perintah mutasi/hapus data (read-only guard).</text>
  <line x1="560" y1="726" x2="560" y2="754" class="line" marker-end="url(#arr)" />

  <!-- 8. DECISION DIAMOND -->
  <polygon points="560,758 720,818 560,878 400,818" fill="#fef3c7" stroke="#b45309" stroke-width="2.2" />
  <text x="560" y="814" text-anchor="middle" class="dec-t">Seluruh Parameter</text>
  <text x="560" y="832" text-anchor="middle" class="dec-t">Memenuhi Target?</text>

  <!-- TIDAK -> PERBAIKAN -> BALIK KE PERSIAPAN/UJI -->
  <path d="M 720 818 H 920 V 505" class="line-red" marker-end="url(#arr-red)" />
  <text x="748" y="808" class="lbl" fill="#dc2626">Tidak</text>
  <rect x="868" y="425" width="220" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <text x="978" y="452" text-anchor="middle" class="node-t" fill="#991b1b">Analisis Log &amp; Perbaikan</text>
  <text x="978" y="472" text-anchor="middle" class="node-d">Perbaiki kode modul / skema</text>
  <text x="978" y="488" text-anchor="middle" class="node-d">lalu uji ulang tahap terkait.</text>
  <path d="M 978 425 V 196 H 854" class="line-red" marker-end="url(#arr-red)" />

  <!-- YA -> DOKUMENTASI HASIL -->
  <line x1="560" y1="878" x2="560" y2="908" class="line" marker-end="url(#arr)" />
  <text x="572" y="897" class="lbl" fill="#15803d">Ya</text>

  <rect x="270" y="912" width="580" height="62" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2" />
  <text x="560" y="938" text-anchor="middle" class="node-t">7. Rekapitulasi Metrik Hasil &amp; Analisis Ketercapaian (Bab IV)</text>
  <text x="560" y="958" text-anchor="middle" class="node-d">Menghitung persentase kelulusan tiap parameter uji &amp; menyusun kesimpulan evaluasi.</text>
  <line x1="560" y1="974" x2="560" y2="1002" class="line" marker-end="url(#arr)" />

  <!-- SELESAI -->
  <rect x="430" y="1006" width="260" height="46" rx="23" fill="#15803d" />
  <text x="560" y="1034" text-anchor="middle" class="term-t">SELESAI</text>
</svg>